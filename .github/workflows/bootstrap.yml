name: Развернуть платформенное ядро

on:
  pull_request:
    paths:
      - .bootstrap/pr-ready

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Развернуть проект
        shell: bash
        run: |
          test ! -f package.json || exit 0
          cat .bootstrap/part-* | base64 --decode > /tmp/kafedra-project.tar.gz
          echo "2867bc9cfc701404de623550ac0216b57a17a6f745531a9364b1ca913dcaa3ed  /tmp/kafedra-project.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kafedra-project.tar.gz
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Зафиксировать проект
        shell: bash
        run: |
          test -f package.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Заложить платформенное ядро"
          git push origin "HEAD:${{ github.head_ref }}"
