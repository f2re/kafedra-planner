name: Публикация GitHub Release

on:
  workflow_run:
    workflows: ["Release gate"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Собрать, проверить и опубликовать
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Определить контекст запуска
        id: context
        shell: bash
        env:
          SOURCE_EVENT: ${{ github.event.workflow_run.event || github.event_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          should_run=false
          reason="Не-main или неуспешный Release gate: публикация не требуется."
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            should_run=true
            reason="Ручной запуск для текущего main."
          elif [[ "$SOURCE_EVENT" == push && "$SOURCE_BRANCH" == main && "$SOURCE_CONCLUSION" == success ]]; then
            should_run=true
            reason="Успешный универсальный Release gate на main."
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          printf 'event=%s branch=%s conclusion=%s sha=%s should_run=%s\n' \
            "$SOURCE_EVENT" "$SOURCE_BRANCH" "$SOURCE_CONCLUSION" "$SOURCE_COMMIT" "$should_run"

      - name: Завершить штатный no-op
        if: steps.context.outputs.should_run != 'true'
        run: echo "${{ steps.context.outputs.reason }}"

      - uses: actions/checkout@v4
        if: steps.context.outputs.should_run == 'true'
        with:
          ref: ${{ steps.context.outputs.source_sha }}

      - uses: actions/setup-node@v4
        if: steps.context.outputs.should_run == 'true'
        with:
          node-version-file: .nvmrc

      - name: Подтвердить exact main
        if: steps.context.outputs.should_run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$MAIN_SHA" == "$SOURCE_SHA" ]] || {
            echo "main изменился: ожидался $SOURCE_SHA, фактически $MAIN_SHA. Выпуск старого commit запрещён." >&2
            exit 1
          }

      - name: Определить выпуск
        id: release
        if: steps.context.outputs.should_run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          RELEASE_EXISTS=false
          TAG_EXISTS=false
          OBJECT_SHA=""
          TAG_IS_ANCESTOR=false

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then RELEASE_EXISTS=true; fi
          if TAG_REF="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null)"; then
            TAG_EXISTS=true
            OBJECT_TYPE="$(jq -r '.object.type' <<<"$TAG_REF")"
            OBJECT_SHA="$(jq -r '.object.sha' <<<"$TAG_REF")"
            if [[ "$OBJECT_TYPE" == tag ]]; then
              OBJECT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJECT_SHA" --jq '.object.sha')"
            fi
          fi

          PARENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq '.parents[0].sha // ""')"
          PARENT_VERSION=""
          if [[ -n "$PARENT_SHA" ]]; then
            PARENT_VERSION="$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$PARENT_SHA" --jq '.content' | tr -d '\n' | base64 --decode | tr -d '[:space:]')"
          fi
          if [[ "$TAG_EXISTS" == true ]]; then
            if [[ "$OBJECT_SHA" == "$SOURCE_SHA" ]]; then
              TAG_IS_ANCESTOR=true
            else
              COMPARE_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/${OBJECT_SHA}...${SOURCE_SHA}" --jq '.status')"
              if [[ "$COMPARE_STATUS" == ahead || "$COMPARE_STATUS" == identical ]]; then TAG_IS_ANCESTOR=true; fi
            fi
          fi

          node scripts/release/release-decision.mjs \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --parent-version "$PARENT_VERSION" \
            --release-exists "$RELEASE_EXISTS" \
            --tag-exists "$TAG_EXISTS" \
            --tag-sha "$OBJECT_SHA" \
            --tag-is-ancestor "$TAG_IS_ANCESTOR" \
            >> "$GITHUB_OUTPUT"

      - name: Подтвердить уже опубликованную версию
        if: steps.context.outputs.should_run == 'true' && steps.release.outputs.publish != 'true'
        run: |
          echo "Новый release не требуется: ${{ steps.release.outputs.reason }}"
          echo "Существующий тег и assets не изменяются."

      - name: Собрать полный автономный bundle один раз
        if: steps.context.outputs.should_run == 'true' && steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/kafedra-release"
          mkdir -p "$OUT"
          docker run --rm \
            -e GITHUB_SHA="$SOURCE_SHA" \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$OUT:/out" \
            node:24-bookworm bash -lc '
              set -Eeuo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3 ca-certificates curl xz-utils binutils systemd
              cd /src
              OUT_DIR=/out KAFEDRA_FULL_BUNDLE_CACHE_DIR=/tmp/kafedra-cache \
                bash scripts/offline/build-full-bundle.sh
            '
          ARCHIVE="$(find "$OUT" -maxdepth 1 -type f -name 'kafedra-planner-*.tar.gz' -print -quit)"
          [[ -f "$ARCHIVE" && -f "$ARCHIVE.sha256" ]]
          [[ -x "$OUT/install-kafedra-planner.sh" && -f "$OUT/README-INSTALL.txt" ]]
          REQUIRE_ARCHIVE_SHA256=true SKIP_SYSTEM_PREFLIGHT=true \
            bash scripts/offline/verify-bundle.sh "$ARCHIVE"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Проверить install, update и rollback того же artifact
        if: steps.context.outputs.should_run == 'true' && steps.release.outputs.publish == 'true'
        shell: bash
        run: bash scripts/offline/systemd-deploy-selftest.sh "$OUT"

      - name: Собрать Project Control из проверенного archive
        if: steps.context.outputs.should_run == 'true' && steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          python3 scripts/offline/project-control-package.py \
            --archive "$ARCHIVE" \
            --output "$OUT" \
            --project-id kafedra-planner \
            --display-name "Кафедра Planner" \
            --adapter kafedra-planner-v1 \
            --version "$VERSION" \
            --source-commit "$SOURCE_SHA" \
            --native-format kafedra-full-airgap-v2
          PACKAGE="$OUT/kafedra-planner-${VERSION}-project-control.f2re.zip"
          [[ -f "$PACKAGE" && -f "$PACKAGE.sha256" ]]
          (cd "$OUT" && sha256sum -c --strict "$(basename "$PACKAGE.sha256")")
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Сформировать общие контрольные суммы
        if: steps.context.outputs.should_run == 'true' && steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$OUT"
          sha256sum \
            "$(basename "$ARCHIVE")" \
            install-kafedra-planner.sh \
            README-INSTALL.txt \
            "$(basename "$PACKAGE")" \
            > SHA256SUMS
          sha256sum -c --strict SHA256SUMS

      - name: Ещё раз подтвердить exact main перед публикацией
        if: steps.context.outputs.should_run == 'true' && steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$MAIN_SHA" == "$SOURCE_SHA" ]] || {
            echo "main изменился после проверки artifact; публикация старого SHA запрещена." >&2
            exit 1
          }

      - name: Создать draft release на exact SHA
        if: steps.context.outputs.should_run == 'true' && steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          TAG="v${VERSION}"
          NOTES="docs/releases/${VERSION}.md"
          [[ -f "$NOTES" ]]
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Kafedra Planner ${VERSION}" \
            --notes-file "$NOTES" \
            --draft

      - name: Загрузить ровно проверенные release assets
        if: steps.context.outputs.should_run == 'true' && steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          TAG="v${VERSION}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            "$OUT/install-kafedra-planner.sh" \
            "$OUT/README-INSTALL.txt" \
            "$PACKAGE" \
            "$PACKAGE.sha256" \
            "$OUT/SHA256SUMS"

      - name: Проверить семь assets до публикации
        if: steps.context.outputs.should_run == 'true' && steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          TAG="v${VERSION}"
          ARCHIVE_NAME="$(basename "$ARCHIVE")"
          PACKAGE_NAME="$(basename "$PACKAGE")"
          EXPECTED="$(printf '%s\n' \
            "$ARCHIVE_NAME" \
            "$ARCHIVE_NAME.sha256" \
            install-kafedra-planner.sh \
            README-INSTALL.txt \
            "$PACKAGE_NAME" \
            "$PACKAGE_NAME.sha256" \
            SHA256SUMS | sort)"
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' | sort)"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "Набор release assets отличается от проверенного." >&2
            diff -u <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$ACTUAL") || true
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.size <= 0) | .name' | grep -q . && {
            echo "Найден пустой release asset." >&2
            exit 1
          } || true

      - name: Опубликовать и проверить tag/release
        if: steps.context.outputs.should_run == 'true' && steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          TAG="v${VERSION}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          [[ "$(jq -r '.draft' <<<"$RELEASE_JSON")" == false ]]
          [[ "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" == false ]]
          TAG_REF="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          OBJECT_TYPE="$(jq -r '.object.type' <<<"$TAG_REF")"
          OBJECT_SHA="$(jq -r '.object.sha' <<<"$TAG_REF")"
          if [[ "$OBJECT_TYPE" == tag ]]; then
            OBJECT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJECT_SHA" --jq '.object.sha')"
          fi
          [[ "$OBJECT_SHA" == "$SOURCE_SHA" ]] || {
            echo "Тег $TAG указывает на $OBJECT_SHA вместо $SOURCE_SHA." >&2
            exit 1
          }
          echo "Опубликован $TAG на exact SHA $SOURCE_SHA с семью проверенными assets."
