name: Release

on:
  workflow_dispatch:
  push:
    branches: [release-run]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: release-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require exact current main
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            workflow_dispatch:refs/heads/main|push:refs/heads/release-run) ;;
            *)
              echo "Release разрешён только вручную из main или через release-run; event=$GITHUB_EVENT_NAME ref=$GITHUB_REF" >&2
              exit 1
              ;;
          esac
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$MAIN_SHA" == "$GITHUB_SHA" ]] || {
            echo "main изменился: workflow=$GITHUB_SHA main=$MAIN_SHA" >&2
            exit 1
          }
          echo "Release source: $GITHUB_SHA ($GITHUB_EVENT_NAME:$GITHUB_REF)"

  verify:
    name: release-verify
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Проверить код и данные один раз
        run: |
          npm run check
          npm test
          npm run smoke
          npm run backup:selftest

  browser:
    name: release-browser-critical
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Критические пользовательские сценарии
        run: >-
          npx playwright test
          tests/browser/protocol-import.spec.mjs
          tests/browser/meetings.spec.mjs
          tests/browser/plan-source-rows.spec.mjs
          tests/browser/docomator-integration.spec.mjs
          tests/browser/docomator-fields.spec.mjs
          tests/browser/academic-performance.spec.mjs
          tests/browser/lifecycle.spec.mjs
      - name: Release readiness, PIN и ACL
        run: |
          npm run test:browser:release
          npm run test:browser:auth
          npm run test:browser:acl

  release-gate:
    name: release-gate
    if: always()
    needs: [preflight, verify, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require release verification
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          VERIFY: ${{ needs.verify.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          printf 'preflight=%s\nverify=%s\nbrowser=%s\n' "$PREFLIGHT" "$VERIFY" "$BROWSER"
          test "$PREFLIGHT" = success
          test "$VERIFY" = success
          test "$BROWSER" = success

  publish:
    name: release-build-verify-publish
    needs: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Require exact current main before build
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$MAIN_SHA" == "$SOURCE_SHA" ]] || {
            echo "main изменился: ожидался $SOURCE_SHA, фактически $MAIN_SHA" >&2
            exit 1
          }

      - name: Determine release decision
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          RELEASE_EXISTS=false
          TAG_EXISTS=false
          OBJECT_SHA=""
          TAG_IS_ANCESTOR=false

          # A failed run may leave an unpublished draft. It is safe to remove only
          # after exact-main preflight: drafts are not public releases and have no tag ref.
          DRAFT_IDS="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag and .draft == true) | .id'
          )"
          for DRAFT_ID in $DRAFT_IDS; do
            DRAFT_TARGET="$(gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" --jq '.target_commitish')"
            echo "Удаляю незавершённый draft $DRAFT_ID для $TAG (target=$DRAFT_TARGET); новый выпуск будет построен от exact main $SOURCE_SHA."
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID"
          done

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then RELEASE_EXISTS=true; fi
          if TAG_REF="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null)"; then
            TAG_EXISTS=true
            OBJECT_TYPE="$(jq -r '.object.type' <<<"$TAG_REF")"
            OBJECT_SHA="$(jq -r '.object.sha' <<<"$TAG_REF")"
            if [[ "$OBJECT_TYPE" == tag ]]; then
              OBJECT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJECT_SHA" --jq '.object.sha')"
            fi
          fi

          PARENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq '.parents[0].sha // ""')"
          PARENT_VERSION=""
          if [[ -n "$PARENT_SHA" ]]; then
            PARENT_VERSION="$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$PARENT_SHA" --jq '.content' | tr -d '\n' | base64 --decode | tr -d '[:space:]')"
          fi
          if [[ "$TAG_EXISTS" == true ]]; then
            if [[ "$OBJECT_SHA" == "$SOURCE_SHA" ]]; then
              TAG_IS_ANCESTOR=true
            else
              COMPARE_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/${OBJECT_SHA}...${SOURCE_SHA}" --jq '.status')"
              if [[ "$COMPARE_STATUS" == ahead || "$COMPARE_STATUS" == identical ]]; then TAG_IS_ANCESTOR=true; fi
            fi
          fi

          node scripts/release/release-decision.mjs \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --parent-version "$PARENT_VERSION" \
            --release-exists "$RELEASE_EXISTS" \
            --tag-exists "$TAG_EXISTS" \
            --tag-sha "$OBJECT_SHA" \
            --tag-is-ancestor "$TAG_IS_ANCESTOR" \
            >> "$GITHUB_OUTPUT"

      - name: Already published — safe no-op
        if: steps.release.outputs.publish != 'true'
        run: echo "Release ${{ steps.release.outputs.tag }} already exists; nothing to publish."

      - name: Build full offline bundle once
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/kafedra-release"
          mkdir -p "$OUT"
          docker run --rm \
            -e GITHUB_SHA="$SOURCE_SHA" \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$OUT:/out" \
            node:24-bookworm bash -lc '
              set -Eeuo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3 ca-certificates curl xz-utils binutils systemd
              cd /src
              OUT_DIR=/out KAFEDRA_FULL_BUNDLE_CACHE_DIR=/tmp/kafedra-cache \
                bash scripts/offline/build-full-bundle.sh
            '
          mapfile -t archives < <(find "$OUT" -maxdepth 1 -type f -name 'kafedra-planner-*.tar.gz' -print | LC_ALL=C sort)
          ((${#archives[@]} == 1)) || { echo "Ожидался один release archive, найдено ${#archives[@]}" >&2; exit 1; }
          ARCHIVE="${archives[0]}"
          [[ -f "$ARCHIVE.sha256" ]]
          [[ -x "$OUT/install-kafedra-planner.sh" && -f "$OUT/README-INSTALL.txt" ]]
          REQUIRE_ARCHIVE_SHA256=true SKIP_SYSTEM_PREFLIGHT=true \
            bash scripts/offline/verify-bundle.sh "$ARCHIVE"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Verify install, update and rollback of the same artifact
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: bash scripts/offline/systemd-deploy-selftest.sh "$OUT"

      - name: Build Project Control from the verified archive
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          python3 scripts/offline/project-control-package.py \
            --archive "$ARCHIVE" \
            --output "$OUT" \
            --project-id kafedra-planner \
            --display-name "Кафедра Planner" \
            --adapter kafedra-planner-v1 \
            --version "$VERSION" \
            --source-commit "$SOURCE_SHA" \
            --native-format kafedra-full-airgap-v2
          PACKAGE="$OUT/kafedra-planner-${VERSION}-project-control.f2re.zip"
          [[ -f "$PACKAGE" && -f "$PACKAGE.sha256" ]]
          (cd "$OUT" && sha256sum -c --strict "$(basename "$PACKAGE.sha256")")
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Verify canonical checksums
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$OUT"
          sha256sum \
            "$(basename "$ARCHIVE")" \
            install-kafedra-planner.sh \
            README-INSTALL.txt \
            "$(basename "$PACKAGE")" \
            > SHA256SUMS
          sha256sum -c --strict SHA256SUMS

      - name: Require exact current main before publication
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$MAIN_SHA" == "$SOURCE_SHA" ]] || {
            echo "main изменился после проверки artifact; публикация $SOURCE_SHA запрещена" >&2
            exit 1
          }

      - name: Create draft release on exact SHA
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          TAG="v${VERSION}"
          NOTES="docs/releases/${VERSION}.md"
          [[ -f "$NOTES" ]]
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Kafedra Planner ${VERSION}" \
            --notes-file "$NOTES" \
            --draft
          RELEASE_ID="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -r --arg tag "$TAG" --arg sha "$SOURCE_SHA" \
                '.[] | select(.tag_name == $tag and .draft == true and .target_commitish == $sha) | .id' \
              | head -n 1
          )"
          [[ -n "$RELEASE_ID" ]] || { echo "Не найден созданный draft для $TAG на $SOURCE_SHA" >&2; exit 1; }
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Upload exactly the verified assets
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            "$OUT/install-kafedra-planner.sh" \
            "$OUT/README-INSTALL.txt" \
            "$PACKAGE" \
            "$PACKAGE.sha256" \
            "$OUT/SHA256SUMS"

      - name: Verify assets and publish
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          ARCHIVE_NAME="$(basename "$ARCHIVE")"
          PACKAGE_NAME="$(basename "$PACKAGE")"
          EXPECTED="$(printf '%s\n' \
            "$ARCHIVE_NAME" \
            "$ARCHIVE_NAME.sha256" \
            install-kafedra-planner.sh \
            README-INSTALL.txt \
            "$PACKAGE_NAME" \
            "$PACKAGE_NAME.sha256" \
            SHA256SUMS | sort)"
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          [[ "$(jq -r '.draft' <<<"$RELEASE_JSON")" == true ]]
          [[ "$(jq -r '.tag_name' <<<"$RELEASE_JSON")" == "$TAG" ]]
          [[ "$(jq -r '.target_commitish' <<<"$RELEASE_JSON")" == "$SOURCE_SHA" ]]
          ACTUAL="$(jq -r '.assets[].name' <<<"$RELEASE_JSON" | sort)"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "Набор assets отличается от проверенного." >&2
            diff -u <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$ACTUAL") || true
            exit 1
          }
          EMPTY="$(jq -r '.assets[] | select(.size <= 0) | .name' <<<"$RELEASE_JSON")"
          [[ -z "$EMPTY" ]] || { echo "Пустые assets: $EMPTY" >&2; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          [[ "$(jq -r '.draft' <<<"$RELEASE_JSON")" == false ]]
          [[ "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" == false ]]
          TAG_REF="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          OBJECT_TYPE="$(jq -r '.object.type' <<<"$TAG_REF")"
          OBJECT_SHA="$(jq -r '.object.sha' <<<"$TAG_REF")"
          if [[ "$OBJECT_TYPE" == tag ]]; then
            OBJECT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJECT_SHA" --jq '.object.sha')"
          fi
          [[ "$OBJECT_SHA" == "$SOURCE_SHA" ]] || {
            echo "Тег $TAG указывает на $OBJECT_SHA вместо $SOURCE_SHA" >&2
            exit 1
          }
          echo "Published $TAG from exact main $SOURCE_SHA with seven verified assets."
