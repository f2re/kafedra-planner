name: Применить аудит и экспорт alpha.9

on:
  push:
    branches:
      - agent/metric-corrections-exports
    paths:
      - .iteration9/ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/metric-corrections-exports
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Проверить и применить пакет
        shell: bash
        run: |
          cat .iteration9/part-* | base64 --decode > /tmp/kafedra-alpha9.tar.gz
          echo "b7190f5c18b3941c532b5fa3010fa21b6f7b828a98784ea7242bec5893dcb76c  /tmp/kafedra-alpha9.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kafedra-alpha9.tar.gz
          npm run check
          npm test
          npm run smoke
          bash -n scripts/offline/*.sh deploy/install.sh
          rm -rf .iteration9 .github/workflows/apply-iteration9.yml
      - name: Зафиксировать проверенный результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Добавить аудит показателей и экспорт план-факт"
          git push origin HEAD:agent/metric-corrections-exports
