name: Применить локальную авторизацию alpha.10

on:
  push:
    branches:
      - agent/local-auth-roles
    paths:
      - .auth10/ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/local-auth-roles
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Проверить и применить пакет
        shell: bash
        run: |
          cat .auth10/part-* | base64 --decode > /tmp/kafedra-auth-alpha10.tar.gz
          echo "1e1ebac147ebc40b8bbe33dcbfad977f952297cfd22779ddf85934f654d1d3b7  /tmp/kafedra-auth-alpha10.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kafedra-auth-alpha10.tar.gz
          node patch-auth.mjs
          rm patch-auth.mjs
          npm run check
          npm test
          npm run smoke
          bash -n scripts/offline/*.sh deploy/install.sh
          rm -rf .auth10 .github/workflows/apply-auth10.yml
      - name: Зафиксировать проверенный результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Добавить локальную авторизацию и роли"
          git push origin HEAD:agent/local-auth-roles
