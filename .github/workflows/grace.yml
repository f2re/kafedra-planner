name: GRACE

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: grace-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  contract:
    name: GRACE / contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install pinned GRACE CLI
        run: bun add --global @osovv/grace-cli@4.0.5
      - name: Resolve immutable comparison base
        id: base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_REF="$PR_BASE_SHA"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            BASE_REF="${GITHUB_SHA}^"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE_REF="origin/main"
          fi
          git cat-file -e "${BASE_REF}^{commit}"
          printf 'base_ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
          printf 'base=%s head=%s\n' "$(git rev-parse "$BASE_REF")" "$(git rev-parse HEAD)"
      - name: Protect durable GRACE model and terminal archive transition
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: node scripts/github/grace-durable-gate.mjs --base "$GRACE_BASE_REF"
      - name: Enforce approved C-* and ObservedWriteScope
        id: policy
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: node scripts/grace-governance.mjs policy --base "$GRACE_BASE_REF" --github-output
      - name: Run selected GRACE final gate
        if: steps.policy.outputs.change_id != ''
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: grace lint --path . --change "${{ steps.policy.outputs.change_id }}" --assertions final --run-commands
      - name: Validate durable GRACE state without a selected change
        if: steps.policy.outputs.change_id == ''
        run: grace lint --path .
      - name: Record GRACE status
        run: grace status --path . --json

  database:
    name: GRACE / database
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve immutable comparison base
        id: base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_REF="$PR_BASE_SHA"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            BASE_REF="${GITHUB_SHA}^"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE_REF="origin/main"
          fi
          git cat-file -e "${BASE_REF}^{commit}"
          printf 'base_ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
      - name: Enforce append-only migration policy
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: node scripts/grace-governance.mjs migrations --base "$GRACE_BASE_REF"
      - name: Prove clean install, exact-base upgrade, repeated migration and recovery
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: bash scripts/ci/grace-db-gate.sh "$GRACE_BASE_REF"

  gate:
    name: GRACE / ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && 'merge-gate' || 'branch-gate' }}
    if: ${{ always() }}
    needs: [contract, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Require GRACE prerequisite jobs
        env:
          CONTRACT: ${{ needs.contract.result }}
          DATABASE: ${{ needs.database.result }}
        run: |
          printf 'contract=%s\ndatabase=%s\n' "$CONTRACT" "$DATABASE"
          test "$CONTRACT" = success
          test "$DATABASE" = success
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        with:
          node-version-file: .nvmrc
      - name: Require every exact-SHA project check
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRACE_CONTRACT_RESULT: ${{ needs.contract.result }}
          GRACE_DATABASE_RESULT: ${{ needs.database.result }}
          GRACE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/github/grace-merge-gate.mjs
