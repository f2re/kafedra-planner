name: GRACE

on:
  pull_request:
    branches: [main]
    paths:
      - '.grace/**'
  workflow_dispatch:

concurrency:
  group: grace-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: ${{ github.event_name == 'pull_request' && 'GRACE / contract' || 'GRACE manual / contract' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install pinned GRACE CLI
        run: bun add --global @osovv/grace-cli@4.0.5
      - name: Resolve immutable comparison base and lifecycle mode
        id: base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_REF="$PR_BASE_SHA"
            POLICY_MODE=pr
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE_REF="origin/main"
            POLICY_MODE=branch
          fi
          git cat-file -e "${BASE_REF}^{commit}"
          printf 'base_ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
          printf 'policy_mode=%s\n' "$POLICY_MODE" >> "$GITHUB_OUTPUT"
          printf 'base=%s head=%s mode=%s\n' \
            "$(git rev-parse "$BASE_REF")" \
            "$(git rev-parse HEAD)" \
            "$POLICY_MODE"
      - name: Protect durable GRACE model and terminal archive transition
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: node scripts/github/grace-durable-gate.mjs --base "$GRACE_BASE_REF" --head HEAD
      - name: Enforce C-* lifecycle and ObservedWriteScope
        id: policy
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
          GRACE_POLICY_MODE: ${{ steps.base.outputs.policy_mode }}
        run: >-
          node scripts/github/grace-policy-gate.mjs
          --base "$GRACE_BASE_REF"
          --mode "$GRACE_POLICY_MODE"
          --github-output
      - name: Run selected GRACE lint and scope gate
        env:
          CHANGE_ID: ${{ steps.policy.outputs.change_id }}
          ASSERTION_MODE: ${{ steps.policy.outputs.assertion_mode }}
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$ASSERTION_MODE" in
            final|baseline)
              [[ -n "$CHANGE_ID" ]] || {
                echo "assertion_mode=$ASSERTION_MODE requires change_id" >&2
                exit 1
              }
              grace lint --path . --change "$CHANGE_ID" --assertions "$ASSERTION_MODE"
              ;;
            current)
              grace lint --path . --assertions current
              ;;
            *)
              echo "Unsupported assertion mode: $ASSERTION_MODE" >&2
              exit 1
              ;;
          esac
      - name: Record GRACE status
        run: grace status --path . --json

  database:
    name: ${{ github.event_name == 'pull_request' && 'GRACE / database' || 'GRACE manual / database' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Detect database or recovery risk
        id: risk
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          specs=(.grace/changes/active/C-*/spec.xml)
          database=false
          if [[ ${#specs[@]} -eq 1 ]] && grep -Eq '<M-(DATABASE|BACKUP|MIGRATION-RUNNER)[[:space:]/>]' "${specs[0]}"; then
            database=true
          fi
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "database/recovery risk: $database"
      - uses: actions/setup-node@v4
        if: steps.risk.outputs.database == 'true'
        with:
          node-version-file: .nvmrc
      - name: Resolve immutable comparison base
        if: steps.risk.outputs.database == 'true'
        id: base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_REF="$PR_BASE_SHA"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE_REF="origin/main"
          fi
          git cat-file -e "${BASE_REF}^{commit}"
          printf 'base_ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
          printf 'base=%s head=%s\n' "$(git rev-parse "$BASE_REF")" "$(git rev-parse HEAD)"
      - name: Enforce append-only migration policy
        if: steps.risk.outputs.database == 'true'
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: node scripts/grace-governance.mjs migrations --base "$GRACE_BASE_REF"
      - name: Prove clean install, exact-base upgrade, repeated migration and recovery
        if: steps.risk.outputs.database == 'true'
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: bash scripts/ci/grace-db-gate.sh "$GRACE_BASE_REF"

  deployment:
    name: ${{ github.event_name == 'pull_request' && 'GRACE / offline deployment' || 'GRACE manual / offline deployment' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Detect offline deployment risk
        id: risk
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          specs=(.grace/changes/active/C-*/spec.xml)
          deployment=false
          scope=none
          if [[ ${#specs[@]} -eq 1 ]] && grep -Eq '<M-OFFLINE-BUNDLE[[:space:]/>]' "${specs[0]}"; then
            deployment=true
            scope="$(node scripts/github/offline-risk-scope.mjs --base "$PR_BASE_SHA" --head "$SOURCE_SHA" --event "$GITHUB_EVENT_NAME")"
            case "$scope" in full|catalogue) ;; *) echo "Unknown offline risk scope: $scope" >&2; exit 1 ;; esac
          fi
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "offline deployment risk: $deployment ($scope)"
      - name: Build and verify standalone agent catalogue
        if: steps.risk.outputs.scope == 'catalogue'
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/kafedra-grace-agent-catalogue"
          bash scripts/offline/build-llm-patch-bundle.sh --output-dir "$OUT"
          VERSION="$(node -p 'require("./package.json").version')"
          node scripts/offline/verify-agent-catalogue.mjs "$OUT/kafedra-llm-catalogue-$VERSION.tar.gz"
      - name: Build and verify every supported target bundle
        if: steps.risk.outputs.scope == 'full'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/kafedra-grace-release-targets"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          GITHUB_SHA="$SOURCE_SHA" bash scripts/offline/build-release-targets.sh "$OUT"
          bash scripts/offline/verify-release-targets.sh "$OUT"

  gate:
    name: ${{ github.event_name == 'pull_request' && 'GRACE / gate' || 'GRACE manual / gate' }}
    if: ${{ always() }}
    needs: [contract, database, deployment]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected GRACE jobs
        env:
          CONTRACT: ${{ needs.contract.result }}
          DATABASE: ${{ needs.database.result }}
          DEPLOYMENT: ${{ needs.deployment.result }}
        run: |
          printf 'contract=%s\ndatabase=%s\ndeployment=%s\n' "$CONTRACT" "$DATABASE" "$DEPLOYMENT"
          test "$CONTRACT" = success
          test "$DATABASE" = success
          test "$DEPLOYMENT" = success
