name: GRACE

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: grace-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  contract:
    name: ${{ github.event_name == 'pull_request' && 'GRACE / contract' || github.ref_name == 'main' && 'GRACE post-merge / contract' || 'GRACE branch / contract' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install pinned GRACE CLI
        run: bun add --global @osovv/grace-cli@4.0.5
      - name: Resolve immutable comparison base and lifecycle mode
        id: base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_REF="$PR_BASE_SHA"
            POLICY_MODE=pr
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            BASE_REF="${GITHUB_SHA}^"
            POLICY_MODE=main
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE_REF="origin/main"
            POLICY_MODE=branch
          fi
          git cat-file -e "${BASE_REF}^{commit}"
          printf 'base_ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
          printf 'policy_mode=%s\n' "$POLICY_MODE" >> "$GITHUB_OUTPUT"
          printf 'base=%s head=%s mode=%s\n' \
            "$(git rev-parse "$BASE_REF")" \
            "$(git rev-parse HEAD)" \
            "$POLICY_MODE"
      - name: Protect durable GRACE model and terminal archive transition
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: node scripts/github/grace-durable-gate.mjs --base "$GRACE_BASE_REF" --head HEAD
      - name: Enforce C-* lifecycle and ObservedWriteScope
        id: policy
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
          GRACE_POLICY_MODE: ${{ steps.base.outputs.policy_mode }}
        run: >-
          node scripts/github/grace-policy-gate.mjs
          --base "$GRACE_BASE_REF"
          --mode "$GRACE_POLICY_MODE"
          --github-output
      - name: Inspect executable assertion environment
        id: assertion_env
        if: ${{ steps.policy.outputs.assertion_mode == 'baseline' || steps.policy.outputs.assertion_mode == 'final' }}
        env:
          CHANGE_ID: ${{ steps.policy.outputs.change_id }}
        run: node scripts/ci/grace-assertion-env.mjs --change "$CHANGE_ID" --github-output
      - name: Install exact project dependencies for executable assertions
        if: ${{ steps.policy.outputs.assertion_mode == 'baseline' || steps.policy.outputs.assertion_mode == 'final' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for approved browser assertions
        if: ${{ steps.assertion_env.outputs.playwright == 'true' }}
        run: npx playwright install --with-deps chromium
      - name: Run selected GRACE assertion gate
        env:
          CHANGE_ID: ${{ steps.policy.outputs.change_id }}
          ASSERTION_MODE: ${{ steps.policy.outputs.assertion_mode }}
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$ASSERTION_MODE" in
            final|baseline)
              [[ -n "$CHANGE_ID" ]] || {
                echo "assertion_mode=$ASSERTION_MODE requires change_id" >&2
                exit 1
              }
              grace lint \
                --path . \
                --change "$CHANGE_ID" \
                --assertions "$ASSERTION_MODE" \
                --run-commands
              ;;
            current)
              grace lint --path . --assertions current
              ;;
            *)
              echo "Unsupported assertion mode: $ASSERTION_MODE" >&2
              exit 1
              ;;
          esac
      - name: Record GRACE status
        run: grace status --path . --json

  database:
    name: ${{ github.event_name == 'pull_request' && 'GRACE / database' || github.ref_name == 'main' && 'GRACE post-merge / database' || 'GRACE branch / database' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve immutable comparison base
        id: base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_REF="$PR_BASE_SHA"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            BASE_REF="${GITHUB_SHA}^"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE_REF="origin/main"
          fi
          git cat-file -e "${BASE_REF}^{commit}"
          printf 'base_ref=%s\n' "$BASE_REF" >> "$GITHUB_OUTPUT"
          printf 'base=%s head=%s\n' "$(git rev-parse "$BASE_REF")" "$(git rev-parse HEAD)"
      - name: Enforce append-only migration policy
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: node scripts/grace-governance.mjs migrations --base "$GRACE_BASE_REF"
      - name: Prove clean install, exact-base upgrade, repeated migration and recovery
        env:
          GRACE_BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: bash scripts/ci/grace-db-gate.sh "$GRACE_BASE_REF"

  gate:
    name: ${{ github.event_name == 'pull_request' && 'GRACE / merge-gate' || github.ref_name == 'main' && 'GRACE post-merge / merge-gate' || 'GRACE branch / merge-gate' }}
    if: ${{ always() }}
    needs: [contract, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Require GRACE prerequisite jobs
        env:
          CONTRACT: ${{ needs.contract.result }}
          DATABASE: ${{ needs.database.result }}
        run: |
          printf 'contract=%s\ndatabase=%s\n' "$CONTRACT" "$DATABASE"
          test "$CONTRACT" = success
          test "$DATABASE" = success
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        with:
          node-version-file: .nvmrc
      - name: Require every exact-SHA project check
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRACE_CONTRACT_RESULT: ${{ neds.contract.result }}
          GRACE_DATABASE_RESULTS: ${{ needs.database.result }}
          GRACE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/github/grace-merge-gate.mjs
