name: Проверка

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - run: bash -n scripts/offline/*.sh deploy/install.sh
