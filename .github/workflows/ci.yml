name: Проверка

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - name: Проверить создание и полное восстановление резервной копии
        run: npm run backup:selftest
      - run: bash -n scripts/offline/*.sh deploy/install.sh

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Установить инструменты браузерной проверки
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Установить Chromium
        run: npx playwright install --with-deps chromium
      - name: Проверить планы desktop и mobile
        run: npm run test:browser:plans
      - name: Проверить остальной desktop и mobile UX
        run: npm run test:browser:core
      - name: Проверить отчёты, подтверждение и научный реестр
        run: npm run test:browser:reports-science
      - name: Проверить персональный план-факт
        run: npm run test:browser:plan-fact
      - name: Проверить авторизацию и роли
        run: npm run test:browser:auth
      - name: Проверить готовность release candidate
        run: npm run test:browser:release
      - name: Проверить объектные права доступа
        run: npm run test:browser:acl
