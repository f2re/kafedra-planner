name: Проверка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node_minimum:
    name: Минимальный Node 24.15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm run check
      - run: npm test
      - run: npm run smoke

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - name: Проверить создание и полное восстановление резервной копии
        run: npm run backup:selftest
      - name: Проверить shell/Python-сценарии поставки
        run: |
          bash -n scripts/offline/*.sh deploy/install.sh
          python3 -m py_compile scripts/offline/python-runtime.py scripts/recognition/ocr.py scripts/offline/project-control-package.py
      - name: Проверить системный preflight
        run: npm run preflight -- --json

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Установить инструменты браузерной проверки
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Установить Chromium
        run: npx playwright install --with-deps chromium
      - name: Проверить планы desktop и mobile
        run: npm run test:browser:plans
      - name: Проверить остальной desktop и mobile UX
        run: npm run test:browser:core
      - name: Проверить отчёты, подтверждение и научный реестр
        run: npm run test:browser:reports-science
      - name: Проверить персональный план-факт
        run: npm run test:browser:plan-fact
      - name: Проверить авторизацию и роли
        run: npm run test:browser:auth
      - name: Проверить готовность release candidate
        run: npm run test:browser:release
      - name: Проверить объектные права доступа
        run: npm run test:browser:acl

  host_node_25:
    name: Сборщик под host Node 25.6
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.6.0
      - name: Проверить разделение host Node и runtime поставки
        shell: bash
        run: |
          set -Eeuo pipefail
          export OUT_DIR="$RUNNER_TEMP/kafedra-runtime-only"
          ARCHIVE="$(npm run --silent bundle:offline:runtime)"
          [[ -f "$ARCHIVE" && -f "$ARCHIVE.sha256" ]]
          REQUIRE_ARCHIVE_SHA256=true SKIP_SYSTEM_PREFLIGHT=true npm run --silent bundle:verify -- "$ARCHIVE"

  offline_bundle:
    name: Full offline Debian 12 + Project Control
    needs: [node_minimum, test, browser, host_node_25]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать и проверить полный Debian 12 bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/kafedra-full"
          LLM_OUT="$RUNNER_TEMP/kafedra-full-llm-test"
          mkdir -p "$OUT" "$LLM_OUT"
          docker run --rm \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$OUT:/out" \
            -v "$LLM_OUT:/out-llm" \
            node:24-bookworm bash -lc '
              set -Eeuo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3 ca-certificates curl xz-utils binutils systemd
              cd /src
              OUT_DIR=/out KAFEDRA_FULL_BUNDLE_CACHE_DIR=/tmp/kafedra-cache \
                bash scripts/offline/build-full-bundle.sh
              ARCHIVE="$(find /out -maxdepth 1 -type f -name "kafedra-planner-*.tar.gz" -print -quit)"
              [[ -f "$ARCHIVE" && -f "$ARCHIVE.sha256" ]]
              mkdir -p /tmp/kafedra-bundle
              tar -xzf "$ARCHIVE" -C /tmp/kafedra-bundle
              BUNDLE="$(find /tmp/kafedra-bundle -mindepth 1 -maxdepth 1 -type d -print -quit)"

              # package inventory хранит версии для integrity, но requested set должен
              # содержать только имена и не должен управлять базовым userspace ОС.
              ! grep -Eq "=" "$BUNDLE/os-packages/requested-packages.txt"
              for package in systemd coreutils util-linux passwd tar; do
                ! grep -Fxq "$package" "$BUNDLE/os-packages/requested-packages.txt"
              done

              # LLM-вариант использует тот же уже проверенный package cache. Fake
              # llama-server нужен только для systemd/health E2E и не публикуется.
              mkdir -p /tmp/fake-llama/bin
              cat > /tmp/fake-llama/bin/llama-server <<'"'"'FAKE_SH'"'"'
          #!/bin/sh
          if [ "${1:-}" = "--version" ]; then echo "fake-llama-server ci"; exit 0; fi
          if [ -e /tmp/kafedra-fail-llama ]; then exit 42; fi
          exec /opt/kafedra-planner/current/runtime/node/bin/node \
            /opt/kafedra-planner/current/runtime/llama/bin/fake-server.mjs "$@"
          FAKE_SH
              cat > /tmp/fake-llama/bin/fake-server.mjs <<'"'"'FAKE_NODE'"'"'
          import http from "node:http";
          const args=process.argv.slice(2); const value=(name,fallback)=>{const i=args.indexOf(name);return i>=0?args[i+1]:fallback};
          const host=value("--host","127.0.0.1"), port=Number(value("--port","8081")), alias=value("--alias","ci-model");
          http.createServer((req,res)=>{res.setHeader("content-type","application/json");if(req.url==="/health")return res.end(JSON.stringify({status:"ok"}));if(req.url==="/v1/models")return res.end(JSON.stringify({data:[{id:alias}]}));res.statusCode=404;res.end("{}");}).listen(port,host);
          FAKE_NODE
              chmod 0755 /tmp/fake-llama/bin/llama-server
              printf "fake llama.cpp MIT license fixture" > /tmp/fake-llama/LICENSE
              printf "GGUF-ci-primary" > /tmp/ci-primary.gguf
              printf "GGUF-ci-reserve" > /tmp/ci-reserve.gguf
              OUT_DIR=/out-llm KAFEDRA_FULL_BUNDLE_CACHE_DIR=/tmp/kafedra-cache \
                bash scripts/offline/build-full-bundle-with-llm.sh \
                  --reuse-os-packages \
                  --llama-runtime /tmp/fake-llama \
                  --model ci=/tmp/ci-primary.gguf \
                  --model reserve=/tmp/ci-reserve.gguf \
                  --default-model ci \
                  --context-size 2048 \
                  --output /out-llm
              LLM_ARCHIVE="$(find /out-llm -maxdepth 1 -type f -name "kafedra-planner-*-llm.tar.gz" -print -quit)"
              [[ -f "$LLM_ARCHIVE" && -f "$LLM_ARCHIVE.sha256" ]]

              # Проверяем оба пути: обычный APT target-системы и настоящий air-gap fallback.
              KAFEDRA_APT_MODE=system bash "$BUNDLE/application/scripts/offline/install-os-packages.sh" \
                "$BUNDLE/os-packages" --check-only
              KAFEDRA_APT_MODE=bundle bash "$BUNDLE/application/scripts/offline/install-os-packages.sh" \
                "$BUNDLE/os-packages"

              "$BUNDLE/runtime/node/bin/node" "$BUNDLE/application/scripts/system-preflight.mjs" --require-full
              "$BUNDLE/runtime/python/python" "$BUNDLE/application/scripts/recognition/ocr.py" doctor --languages rus+eng
              DATA=/tmp/kafedra-data
              mkdir -p "$DATA"
              export KAFEDRA_APPLICATION_DIR="$BUNDLE/application"
              export KAFEDRA_DATA_DIR="$DATA"
              export KAFEDRA_DATABASE_PATH="$DATA/kafedra-planner.sqlite3"
              export KAFEDRA_RECOGNITION_PYTHON="$BUNDLE/runtime/python/python"
              export KAFEDRA_RECOGNITION_SCRIPT="$BUNDLE/application/scripts/recognition/ocr.py"
              export KAFEDRA_HOST=127.0.0.1
              export KAFEDRA_PORT=18080
              cd /tmp
              "$BUNDLE/runtime/node/bin/node" "$BUNDLE/application/scripts/migrate.mjs"
              INITIAL_AUTH_JSON="$("$BUNDLE/runtime/node/bin/node" "$BUNDLE/application/scripts/ensure-initial-admin.mjs")"
              "$BUNDLE/runtime/node/bin/node" -e "const v=JSON.parse(process.argv[1]); const hasPassword=Object.prototype.hasOwnProperty.call(v,\"password\"); if(v.created!==false||v.accountCreated!==true||v.username!==\"admin\"||v.pinSetupRequired!==true||hasPassword) process.exit(1)" "$INITIAL_AUTH_JSON"
              cd "$BUNDLE/application"
              "$BUNDLE/runtime/node/bin/node" apps/api/src/main.mjs >/tmp/kafedra-api.log 2>&1 & API_PID=$!
              "$BUNDLE/runtime/node/bin/node" apps/worker/src/main.mjs >/tmp/kafedra-worker.log 2>&1 & WORKER_PID=$!
              cleanup(){ kill "$API_PID" "$WORKER_PID" >/dev/null 2>&1 || true; }
              trap cleanup EXIT
              READY=0
              for i in $(seq 1 20); do
                if KAFEDRA_PORT=18080 "$BUNDLE/runtime/node/bin/node" -e '\''const http=require("node:http");const r=http.get({host:"127.0.0.1",port:18080,path:"/api/system/health"},x=>{x.resume();process.exit(x.statusCode>=200&&x.statusCode<300?0:1)});r.on("error",()=>process.exit(1));'\''; then READY=1; break; fi
                sleep 1
              done
              if [[ "$READY" != 1 ]]; then cat /tmp/kafedra-api.log /tmp/kafedra-worker.log >&2; exit 1; fi
            '
          ARCHIVE="$(find "$OUT" -maxdepth 1 -type f -name 'kafedra-planner-*.tar.gz' -print -quit)"
          LLM_ARCHIVE="$(find "$LLM_OUT" -maxdepth 1 -type f -name 'kafedra-planner-*-llm.tar.gz' -print -quit)"
          [[ -f "$ARCHIVE" && -f "$LLM_ARCHIVE" ]]
          [[ "$(stat -c %s "$ARCHIVE")" -gt 50000000 ]]
          [[ -x "$OUT/install-kafedra-planner.sh" ]]
          [[ -f "$OUT/README-INSTALL.txt" ]]
          [[ -x "$LLM_OUT/install-kafedra-planner.sh" ]]
          [[ -f "$LLM_OUT/README-INSTALL.txt" ]]
      - name: Проверить реальную offline-установку под systemd
        shell: bash
        run: bash scripts/offline/systemd-deploy-selftest.sh "$RUNNER_TEMP/kafedra-full"
      - name: Проверить offline llama.cpp/GGUF установку под systemd
        shell: bash
        run: bash scripts/offline/systemd-deploy-selftest.sh "$RUNNER_TEMP/kafedra-full-llm-test"
      - name: Собрать и проверить Project Control update
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/kafedra-full"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ARCHIVE="$(find "$OUT" -maxdepth 1 -type f -name 'kafedra-planner-*.tar.gz' -print -quit)"
          [[ -f "$ARCHIVE" && -f "$ARCHIVE.sha256" ]]
          python3 scripts/offline/project-control-package.py \
            --archive "$ARCHIVE" \
            --output "$OUT" \
            --project-id kafedra-planner \
            --display-name "Кафедра Planner" \
            --adapter kafedra-planner-v1 \
            --version "$VERSION" \
            --source-commit "$SOURCE_SHA" \
            --native-format kafedra-full-airgap-v2
          PACKAGE="$OUT/kafedra-planner-${VERSION}-project-control.f2re.zip"
          [[ -f "$PACKAGE" && -f "$PACKAGE.sha256" ]]
          (cd "$OUT" && sha256sum -c --strict "$(basename "$PACKAGE.sha256")")
          python3 - "$PACKAGE" "$ARCHIVE" "$VERSION" "$SOURCE_SHA" <<'PY'
          import hashlib, json, sys, tarfile, zipfile
          from pathlib import Path

          package, native = map(Path, sys.argv[1:3])
          version, source_sha = sys.argv[3:5]

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          with zipfile.ZipFile(package) as archive:
              manifest = json.loads(archive.read("f2re-service.json"))
              payload = manifest["payload"]["path"]
              assert set(archive.namelist()) == {"f2re-service.json", payload}
              assert manifest["schema"] == "f2re-managed-service/v1"
              assert manifest["controllerApi"] == 1
              assert manifest["projectId"] == "kafedra-planner"
              assert manifest["adapter"] == "kafedra-planner-v1"
              assert manifest["nativeBundleFormat"] == "kafedra-full-airgap-v2"
              assert manifest["version"] == version
              assert manifest["sourceCommit"] == source_sha
              digest = hashlib.sha256()
              size = 0
              with archive.open(payload) as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      size += len(chunk)
                      digest.update(chunk)
              assert digest.hexdigest() == manifest["payload"]["sha256"] == sha256(native)
              assert size == manifest["payload"]["size"] == native.stat().st_size

          with tarfile.open(native, "r:gz") as archive:
              names = {member.name.rstrip("/") for member in archive if member.name}
          roots = {name.split("/", 1)[0] for name in names}
          assert len(roots) == 1
          root = next(iter(roots))
          for required in ("install.sh", "application/VERSION", "deployment.json"):
              assert f"{root}/{required}" in names, required
          PY
      - name: Опубликовать Project Control update
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kafedra-planner-project-control-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kafedra-full/*-project-control.f2re.zip
            ${{ runner.temp }}/kafedra-full/*-project-control.f2re.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Опубликовать готовый full offline bundle
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kafedra-planner-full-offline-${{ github.sha }}
          path: ${{ runner.temp }}/kafedra-full/*
          if-no-files-found: error
          retention-days: 30
