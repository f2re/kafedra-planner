name: Проверка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - name: Проверить создание и полное восстановление резервной копии
        run: npm run backup:selftest
      - name: Проверить shell-сценарии поставки
        run: bash -n scripts/offline/*.sh deploy/install.sh
      - name: Проверить системный preflight
        run: npm run preflight -- --json


  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Установить инструменты браузерной проверки
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Установить Chromium
        run: npx playwright install --with-deps chromium
      - name: Проверить планы desktop и mobile
        run: npm run test:browser:plans
      - name: Проверить остальной desktop и mobile UX
        run: npm run test:browser:core
      - name: Проверить отчёты, подтверждение и научный реестр
        run: npm run test:browser:reports-science
      - name: Проверить персональный план-факт
        run: npm run test:browser:plan-fact
      - name: Проверить авторизацию и роли
        run: npm run test:browser:auth
      - name: Проверить готовность release candidate
        run: npm run test:browser:release
      - name: Проверить объектные права доступа
        run: npm run test:browser:acl

  offline_bundle:
    name: Автономный комплект
    needs: [test, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Собрать автономный комплект штатной командой
        shell: bash
        run: |
          set -Eeuo pipefail
          export OUT_DIR="$RUNNER_TEMP/kafedra-release"
          ARCHIVE="$(npm run --silent bundle:offline)"
          [[ -f "$ARCHIVE" ]]
          [[ -f "$ARCHIVE.sha256" ]]
          [[ "$(stat -c %s "$ARCHIVE")" -gt 20000000 ]]
          tar -tzf "$ARCHIVE" > "$RUNNER_TEMP/kafedra-release-entries.txt"
          grep -q '/runtime/node/bin/node$' "$RUNNER_TEMP/kafedra-release-entries.txt"
          REQUIRE_ARCHIVE_SHA256=true npm run --silent bundle:verify -- "$ARCHIVE"
      - name: Опубликовать готовый offline bundle
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kafedra-planner-offline-${{ github.sha }}
          path: ${{ runner.temp }}/kafedra-release/kafedra-planner-*.tar.gz*
          if-no-files-found: error
          retention-days: 30
