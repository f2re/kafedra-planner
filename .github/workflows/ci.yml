name: Проверка

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - name: Проверить создание и полное восстановление резервной копии
        run: npm run backup:selftest
      - name: Проверить shell-сценарии поставки
        run: bash -n scripts/offline/*.sh deploy/install.sh
      - name: Проверить системный preflight
        run: npm run preflight -- --json
      - name: Собрать и проверить автономный комплект со встроенным Node
        shell: bash
        run: |
          set -Eeuo pipefail
          export NODE_RUNTIME_DIR="$(dirname "$(dirname "$(command -v node)")")"
          export REQUIRE_NODE_RUNTIME=true
          export OUT_DIR="$RUNNER_TEMP/kafedra-release"
          ARCHIVE="$(npm run --silent bundle:offline)"
          [[ -f "$ARCHIVE" ]]
          [[ -f "$ARCHIVE.sha256" ]]
          REQUIRE_EMBEDDED_RUNTIME=true REQUIRE_ARCHIVE_SHA256=true \
            npm run --silent bundle:verify -- "$ARCHIVE"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Установить инструменты браузерной проверки
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Установить Chromium
        run: npx playwright install --with-deps chromium
      - name: Проверить планы desktop и mobile
        run: npm run test:browser:plans
      - name: Проверить остальной desktop и mobile UX
        run: npm run test:browser:core
      - name: Проверить отчёты, подтверждение и научный реестр
        run: npm run test:browser:reports-science
      - name: Проверить персональный план-факт
        run: npm run test:browser:plan-fact
      - name: Проверить авторизацию и роли
        run: npm run test:browser:auth
      - name: Проверить готовность release candidate
        run: npm run test:browser:release
      - name: Проверить объектные права доступа
        run: npm run test:browser:acl
