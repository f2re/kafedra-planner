name: Применить release candidate rc.1

on:
  push:
    branches:
      - agent/release-candidate-readiness
    paths:
      - .rc1/ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/release-candidate-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Проверить и применить пакет
        shell: bash
        run: |
          cat .rc1/part-* | base64 --decode > /tmp/kafedra-rc1.tar.gz
          echo "0ece538318483e70d24bb17f3ff07f19b72d22f9ceb99f3babdfce383e8dd7bd  /tmp/kafedra-rc1.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kafedra-rc1.tar.gz
          node patch-rc1.mjs
          rm patch-rc1.mjs
          npm run check
          npm test
          npm run smoke
          bash -n scripts/offline/*.sh deploy/install.sh
          git checkout origin/main -- .github/workflows/ci.yml
          rm -rf .rc1 .github/workflows/apply-rc1.yml
      - name: Зафиксировать проверенный результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Подготовить release candidate rc.1"
          git push origin HEAD:agent/release-candidate-readiness
