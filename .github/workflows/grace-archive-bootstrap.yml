name: GRACE archive bootstrap

on:
  push:
    branches: [infra/archive-grace4-governance-v2]
    paths:
      - .github/workflows/grace-archive-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: grace-archive-bootstrap
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/archive-grace4-governance-v2
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Move the complete applied change bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"

          active=.grace/changes/active/C-GRACE4-GOVERNANCE
          archive=.grace/changes/archive/C-GRACE4-GOVERNANCE
          test -f "$active/spec.xml"
          test -f "$active/plan.xml"
          test ! -e "$archive"
          mkdir -p "$(dirname "$archive")"
          mv "$active" "$archive"

          python3 - <<'PY'
          from pathlib import Path
          root = Path('.grace/changes/archive/C-GRACE4-GOVERNANCE')
          for name in ('spec.xml', 'plan.xml'):
              path = root / name
              text = path.read_text(encoding='utf-8')
              old = 'status="approved"'
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one approved root status')
              path.write_text(text.replace(old, 'status="applied"', 1), encoding='utf-8')
          PY

          rm -- .github/workflows/grace-archive-bootstrap.yml

      - name: Commit and verify archive-only candidate
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore(grace): archive applied governance change"
          node scripts/grace-governance.mjs policy --base origin/main --head HEAD
          node scripts/grace-governance.mjs migrations --base origin/main --head HEAD
          node --test tests/grace-governance.test.mjs tests/migration-inventory.test.mjs
          test -z "$(git status --porcelain)"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish archive candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          git push origin HEAD:refs/heads/infra/archive-grace4-governance-v2
