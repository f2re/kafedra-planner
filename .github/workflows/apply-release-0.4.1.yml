name: Supersede release 0.4.1 change

on:
  push:
    branches:
      - release/0.4.1-280-recovery

permissions:
  contents: write

jobs:
  supersede:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Сформировать terminal superseded archive
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_SHA=f6ec17cd88ab2ec5aaea7548da871fb5588b30a4
          BRANCH=release/0.4.1-280-recovery
          CHANGE=C-RELEASE-0-4-1-280
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          SRC=".grace/changes/active/$CHANGE"
          DST=".grace/changes/archive/$CHANGE"
          test -f "$SRC/spec.xml"
          test -f "$SRC/plan.xml"
          test -f "$SRC/release-audit.md"
          test ! -e "$DST"
          mkdir -p "$DST"
          python3 - "$SRC" "$DST" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])
          for name in ('spec.xml', 'plan.xml'):
              raw = (src / name).read_bytes()
              old = b'status="approved"'
              new = b'status="superseded"'
              if raw.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one approved root status')
              (dst / name).write_bytes(raw.replace(old, new, 1))
          shutil.copyfile(src / 'release-audit.md', dst / 'release-audit.md')
          if (src / 'release-audit.md').read_bytes() != (dst / 'release-audit.md').read_bytes():
              raise SystemExit('release-audit.md byte drift')
          PY
          rm -rf "$SRC"
          git checkout "$MAIN_SHA" -- .github/workflows/apply-release-0.4.1.yml
          git add -A
          python3 - <<'PY'
          import subprocess

          expected = {
              '.grace/changes/archive/C-RELEASE-0-4-1-280/plan.xml',
              '.grace/changes/archive/C-RELEASE-0-4-1-280/release-audit.md',
              '.grace/changes/archive/C-RELEASE-0-4-1-280/spec.xml',
          }
          actual = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', 'f6ec17cd88ab2ec5aaea7548da871fb5588b30a4'],
              text=True,
          ).splitlines()))
          if actual != expected:
              raise SystemExit(f'archive-only diff mismatch: {sorted(actual)}')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'GRACE: supersede broken release 0.4.1 change'
          git push origin HEAD:"$BRANCH"
