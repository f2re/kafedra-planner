name: Apply release 0.4.1 recovery

on:
  push:
    branches:
      - release/0.4.1-280-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Выполнить утверждённую подготовку выпуска
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_REF=f6ec17cd88ab2ec5aaea7548da871fb5588b30a4
          git cat-file -e "${SOURCE_REF}:.github/workflows/apply-release-0.4.1.yml"
          test ! -e tests/release-workflow.test.mjs
          cp tests/release-recovery-workflow.test.mjs tests/release-workflow.test.mjs
          python3 - "$SOURCE_REF" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          source_ref = sys.argv[1]
          source = subprocess.check_output(
              ["git", "show", f"{source_ref}:.github/workflows/apply-release-0.4.1.yml"],
              text=True,
          )
          marker = "        run: |\n"
          if source.count(marker) != 1:
              raise SystemExit("approved preparation workflow must contain exactly one run block")
          raw = source.split(marker, 1)[1]
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          ) + "\n"

          old_push = "git push origin HEAD:release/0.4.1-280-final"
          new_push = "git push origin HEAD:release/0.4.1-280-recovery"
          if body.count(old_push) != 1:
              raise SystemExit("approved preparation push target was not found exactly once")
          body = body.replace(old_push, new_push, 1)

          needle = 'git config user.name "github-actions[bot]"'
          if body.count(needle) != 1:
              raise SystemExit("commit configuration marker was not found exactly once")
          verification = """npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run docs:check
          node --test tests/release-workflow.test.mjs tests/release-assets-contract.test.mjs tests/release-0.4.1.test.mjs
          npm test
          npm run smoke
          bash -n scripts/offline/*.sh deploy/install.sh
          git diff --check
          """
          body = body.replace(needle, verification + needle, 1)
          Path("/tmp/apply-release-0.4.1.sh").write_text(body, encoding="utf-8")
          PY
          bash /tmp/apply-release-0.4.1.sh
