name: Применить контур поручений

on:
  push:
    branches:
      - agent/directives-workflow-foundation
    paths:
      - .iteration6/ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/directives-workflow-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Проверить и развернуть пакет
        shell: bash
        run: |
          cat .iteration6/part-* | base64 --decode > /tmp/kafedra-workflow-foundation.tar.gz
          echo "5ab430db6256728b10fd681cb3da9b9e7efe0e49d6b7692db5f6b559b321fc7a  /tmp/kafedra-workflow-foundation.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kafedra-workflow-foundation.tar.gz
          node scripts/apply-workflow-foundation.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/router.mjs')
          source = path.read_text()
          fixes = {
              'path.match(/^/api/directives/([^/]+)$/)': r'path.match(/^\/api\/directives\/([^/]+)$/)',
              'path.match(/^/api/assignments/([^/]+)/progress$/)': r'path.match(/^\/api\/assignments\/([^/]+)\/progress$/)',
              'path.match(/^/api/assignments/([^/]+)/report$/)': r'path.match(/^\/api\/assignments\/([^/]+)\/report$/)',
          }
          for old, new in fixes.items():
              if old not in source:
                  raise SystemExit(f'Не найден сгенерированный маршрут: {old}')
              source = source.replace(old, new)
          path.write_text(source)
          PY
          rm -rf .iteration6 scripts/apply-workflow-foundation.mjs
      - name: Проверить проект
        run: |
          npm run check
          npm test
          npm run smoke
          bash -n scripts/offline/*.sh deploy/install.sh
      - name: Зафиксировать результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Добавить распоряжения, поручения и контроль сроков"
          git push origin HEAD:agent/directives-workflow-foundation
