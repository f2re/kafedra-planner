name: Обновить README для rc.3

on:
  push:
    branches:
      - agent/object-acl-rc3
    paths:
      - .readme-rc3-ready

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/object-acl-rc3
      - name: Обновить релизный статус
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          old = '> Текущий статус: **release candidate `0.1.0-rc.2`**. Основные рабочие контуры, локальная авторизация, проверяемые резервные копии и автоматический откат обновления реализованы; перед стабильным релизом остаются объектные права и внешняя доставка уведомлений.'
          new = '> Текущий статус: **release candidate `0.1.0-rc.3`**. Основные рабочие контуры, локальная авторизация, объектные права, проверяемые резервные копии и автоматический откат обновления реализованы; перед стабильным релизом остаются внешняя доставка уведомлений и целевая эксплуатационная приёмка.'
          if old not in text:
              raise SystemExit('ожидаемая строка статуса README не найдена')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Зафиксировать README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Актуализировать README для release candidate rc.3"
          git push origin HEAD:agent/object-acl-rc3
