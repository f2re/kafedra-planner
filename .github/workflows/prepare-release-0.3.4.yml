name: Подготовить выпуск 0.3.4

on:
  push:
    branches: ["release/0.3.4-docomator-fields"]
    paths: [".github/workflows/prepare-release-0.3.4.yml"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.4-docomator-fields
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Собрать чистую интеграционную ветку от актуального main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/feature/docomator-fields-0.3.4:refs/remotes/origin/feature/docomator-fields-0.3.4
          FEATURE=refs/remotes/origin/feature/docomator-fields-0.3.4
          git rev-parse --verify "$FEATURE"

          git checkout "$FEATURE" -- \
            .github/workflows/organization.yml \
            .github/workflows/release-gate.yml \
            .github/workflows/release.yml \
            VERSION \
            apps/api/src/docomator-integration-router.mjs \
            docs/DOCOMATOR_PEOPLE_IMPORT.md \
            docs/RELEASE_CANDIDATE.md \
            docs/VALIDATION.md \
            package.json \
            package-lock.json \
            packages/integrations/src/docomator-fields.mjs \
            public/docomator-fields.css \
            public/docomator-fields.js \
            tests/browser/docomator-fields.spec.mjs \
            tests/docomator-fields-migration.test.mjs \
            tests/docomator-fields.test.mjs \
            tests/docs-consistency.test.mjs \
            tests/release-assets-contract.test.mjs \
            tests/release-recovery-workflow.test.mjs

          git show "$FEATURE:migrations/029_docomator_field_mapping.sql" > migrations/030_docomator_field_mapping.sql
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/prepare-release-0.3.4.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'CI проверяет миграции до schema 029, foreign keys, quick check, logical digest и полный backup/restore.',
              'CI проверяет миграции до schema 029, backup/restore, Node 24.15 и host Node 25, desktop/mobile Chromium, интеграцию Оформлятора, full-offline Debian 12, additive APT policy и systemd-сценарии с LLM и без него.'
          )
          text = text.replace(
              'CI проверяет миграции до schema 030, foreign keys, quick check, logical digest и полный backup/restore.',
              'CI проверяет миграции до schema 030, backup/restore, Node 24.15 и host Node 25, desktop/mobile Chromium, интеграцию Оформлятора, full-offline Debian 12, additive APT policy и systemd-сценарии с LLM и без него.'
          )
          text = text.replace(
              "test('обновление 28 → 29 добавляет mapping полей без изменения существующей интеграции'",
              "test('обновление 28 → 29 добавляет выбор полей и сохраняет существующие связи Оформлятора'"
          )
          text = text.replace(
              "test('обновление 29 → 30 добавляет mapping полей без изменения существующей интеграции'",
              "test('обновление 29 → 30 добавляет выбор полей и сохраняет существующие связи Оформлятора'"
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 .github/scripts/prepare-release-0.3.4.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/docomator-fields-migration.test.mjs')
          text = path.read_text(encoding='utf-8')
          old_schema = "assert.equal(database.getSchemaVersion(), 30);"
          target_schema = "assert.equal(database.getSchemaVersion(), 29);"
          if old_schema not in text or target_schema not in text:
              raise SystemExit('migration test: не найдены assertions для перестановки')
          text = text.replace(old_schema, '__OLD_SCHEMA_ASSERT__', 1)
          text = text.replace(target_schema, old_schema, 1)
          text = text.replace('__OLD_SCHEMA_ASSERT__', target_schema, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/prepare-release-0.3.4.yml .github/scripts/prepare-release-0.3.4.py

      - name: Проверить исходный код, миграции и release contract
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run smoke

      - name: Зафиксировать подготовленный выпуск
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          git commit -m "release: Kafedra Planner 0.3.4 — поля Оформлятора и schema 30"
          git push origin HEAD:release/0.3.4-docomator-fields
