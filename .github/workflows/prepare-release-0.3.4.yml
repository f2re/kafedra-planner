name: Подготовить выпуск 0.3.4

on:
  push:
    branches: ["release/0.3.4-docomator-fields"]
    paths: [".github/workflows/prepare-release-0.3.4.yml"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.4-docomator-fields
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Собрать чистую интеграционную ветку от актуального main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main feature/docomator-fields-0.3.4
          FEATURE=origin/feature/docomator-fields-0.3.4

          git checkout "$FEATURE" -- \
            .github/workflows/organization.yml \
            .github/workflows/release-gate.yml \
            .github/workflows/release.yml \
            VERSION \
            apps/api/src/docomator-integration-router.mjs \
            docs/DOCOMATOR_PEOPLE_IMPORT.md \
            docs/RELEASE_CANDIDATE.md \
            docs/VALIDATION.md \
            package.json \
            package-lock.json \
            packages/integrations/src/docomator-fields.mjs \
            public/docomator-fields.css \
            public/docomator-fields.js \
            tests/browser/docomator-fields.spec.mjs \
            tests/docomator-fields-migration.test.mjs \
            tests/docomator-fields.test.mjs \
            tests/docs-consistency.test.mjs \
            tests/release-assets-contract.test.mjs \
            tests/release-recovery-workflow.test.mjs

          git show "$FEATURE:migrations/029_docomator_field_mapping.sql" > migrations/030_docomator_field_mapping.sql

          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def must_replace(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"{path}: не найден обязательный фрагмент: {old[:120]!r}")
              write(path, text.replace(old, new, count))

          # README: сохраняем актуальный поток без согласований и библиотеку шаблонов из main.
          must_replace(
              'README.md',
              '> Текущий рубеж: **`0.3.3`**, схема SQLite **29**.',
              '> Текущий рубеж: **`0.3.4`**, схема SQLite **30**.'
          )
          must_replace(
              'README.md',
              'Можно выбрать пространство, группу или всех сотрудников и предварительно увидеть количество и ФИО. Синхронизация идемпотентна по `remote employee id`; первая загрузка может сопоставить существующего человека по нормализованному ФИО. Повторный импорт обновляет ту же запись и не удаляет локальные планы, задачи, назначения и историю.',
              'Можно выбрать пространство, группу или всех сотрудников и предварительно увидеть количество и ФИО. Для выбранного пространства система загружает определения полей сотрудников: ФИО переносится всегда, для `E-mail` и `Должность` оператор назначает конкретные remote properties, а телефон, подразделение, учёную степень и другие свойства выбирает отдельно. Синхронизация идемпотентна по `remote employee id`; повторный импорт обновляет ту же запись и не удаляет локальные планы, задачи, назначения и историю.'
          )
          must_replace(
              'README.md',
              'CI проверяет миграции до schema 029, foreign keys, quick check, logical digest и полный backup/restore.',
              'CI проверяет миграции до schema 030, foreign keys, quick check, logical digest и полный backup/restore.'
          )

          # Английская точка входа.
          must_replace(
              'README.en.md',
              '> Current milestone: **`0.3.3`**, SQLite schema **28**.',
              '> Current milestone: **`0.3.4`**, SQLite schema **30**.'
          )
          text = read('README.en.md')
          text = text.replace(
              '- assignment execution, reports, manager confirmation or return for revision;',
              '- assignment execution with one-step completion, reversible return to work, and optional evidence;'
          )
          text = text.replace(
              '- meetings, agenda, decisions, minutes and extracts;',
              '- meetings, agenda, decisions, minutes, extracts and a versioned DOCX template library;'
          )
          text = text.replace(
              '- optional local Docomator connection with address/port health checks and idempotent employee import by stable remote identity;',
              '- optional local Docomator connection with address/port checks, explicit field mapping and idempotent employee import by stable remote identity;'
          )
          text = text.replace(
              'After the connection is verified, the administrator selects a Docomator space, an optional group or all employees, previews names and starts the import. Synchronization is idempotent by stable remote employee ID; the first import may match an existing local person by normalized full name. Repeated imports update the same record without deleting local plans, assignments, reports or history.',
              'After the connection is verified, the administrator selects a Docomator space, an optional group or all employees, previews names and chooses which properties to transfer. Full name is always imported; remote properties can be mapped to local E-mail and Position, while phone, department, degree and other person fields are selected explicitly. Synchronization is idempotent by stable remote employee ID and never deletes local plans, assignments or history.'
          )
          write('README.en.md', text)

          # Roadmap и UX сохраняются из актуального main; меняются только новый рубеж и новый контур полей.
          must_replace('docs/ROADMAP.md', '## Текущий рубеж — `0.3.3`', '## Текущий рубеж — `0.3.4`')
          must_replace(
              'docs/ROADMAP.md',
              '- необязательное подключение к Оформлятору и идемпотентный импорт сотрудников;',
              '- необязательное подключение к Оформлятору, явный выбор полей и идемпотентный импорт сотрудников;'
          )
          must_replace(
              'docs/ROADMAP.md',
              'Текущая схема SQLite — `29`. `0.3.3` остаётся текущей версией до отдельного законченного релизного рубежа.',
              'Текущая схема SQLite — `30`. `0.3.4` объединяет выбор полей Оформлятора, библиотеку версий DOCX-шаблонов, прямое завершение задач и ранее реализованные визуальные шаблоны заседаний и адаптивные ручные планы.'
          )
          must_replace('docs/ROADMAP.md', 'Состояние: реализовано в схемах `26–29`.', 'Состояние: реализовано в схемах `26–30`.')
          must_replace(
              'docs/ROADMAP.md',
              '- preview ФИО до импорта;\n- идемпотентную внешнюю связь по remote employee id;',
              '- preview ФИО до импорта;\n- явное сопоставление remote properties с `E-mail` и `Должность`;\n- выбор дополнительных свойств сотрудников без расширения базовой таблицы `people`;\n- идемпотентную внешнюю связь по remote employee id;'
          )
          must_replace(
              'docs/ROADMAP.md',
              'Критерий stable: чистая установка, обновление существующей базы до схемы `29`,',
              'Критерий stable: чистая установка, обновление существующей базы до схемы `30`,'
          )
          must_replace(
              'docs/UX_FLOWS.md',
              'Статус: рабочие контуры версии `0.3.3`, схема SQLite `29`.',
              'Статус: рабочие контуры версии `0.3.4`, схема SQLite `30`.'
          )

          # Release candidate и validation contract.
          must_replace(
              'docs/RELEASE_CANDIDATE.md',
              '`0.3.4` — текущий эксплуатационный release candidate, схема SQLite **29**.',
              '`0.3.4` — текущий эксплуатационный release candidate, схема SQLite **30**.'
          )
          text = read('docs/RELEASE_CANDIDATE.md')
          text = text.replace(
              '4. администратор может проверить локальный Оформлятор, выбрать пространство/группу и идемпотентно импортировать сотрудников без сохранения кода доступа и без удаления локальной истории.',
              '4. администратор может проверить локальный Оформлятор, выбрать пространство/группу, назначить источники для E-mail/Должности и явно выбрать дополнительные поля без сохранения кода доступа и без удаления локальной истории.'
          )
          text = text.replace(
              '- распоряжения, поручения, прогресс, отчёты и подтверждение;',
              '- распоряжения, задачи, прогресс, прямое завершение и необязательные подтверждающие материалы;'
          )
          text = text.replace(
              '- интеграция Оформлятора: host/port, health/readiness/data, краткоживущий PIN, пространство/группа, preview и идемпотентная внешняя связь сотрудника;',
              '- интеграция Оформлятора: host/port, health/readiness/data, краткоживущий PIN, пространство/группа, preview, field mapping и идемпотентная внешняя связь сотрудника;'
          )
          text = text.replace(
              '- миграции 19/25/26/27 → 28, `quick_check`, `foreign_key_check`, backup/restore и logical digest;',
              '- миграции поддерживаемых схем 19–29 → 30, `quick_check`, `foreign_key_check`, backup/restore и logical digest;'
          )
          text = text.replace('чистую установку `0.3.3`', 'чистую установку `0.3.4`')
          text = text.replace('обновление существующей базы до схемы 28', 'обновление существующей базы до схемы 30')
          text = text.replace(
              'реальный health/readiness/data/import без сохранения кода;',
              'реальный health/readiness/data/import с выбором полей и без сохранения кода;'
          )
          write('docs/RELEASE_CANDIDATE.md', text)

          text = read('docs/VALIDATION.md')
          text = text.replace('Актуальный рубеж: `0.3.4`, схема SQLite **29**.', 'Актуальный рубеж: `0.3.4`, схема SQLite **30**.')
          text = text.replace('- миграции старых поддерживаемых схем до 29;', '- миграции старых поддерживаемых схем до 30;')
          text = text.replace(
              '- upgrade интеграции Оформлятора 27 → 28 и field mapping 28 → 29 без изменения существующих сотрудников, задач, plan evidence и external links;',
              '- upgrade интеграции Оформлятора 27 → 28, библиотеки шаблонов 28 → 29 и field mapping 29 → 30 без изменения существующих сотрудников, задач, plan evidence и external links;'
          )
          text = text.replace('ручной план → поручение → отчёт → подтверждение → DOCX;', 'ручной план → задача → `Выполнено` → DOCX;')
          text = text.replace(
              'адрес/порт Оформлятора → проверка health/readiness/data → ввод PIN → пространство/группа → preview → импорт;',
              'адрес/порт Оформлятора → проверка health/readiness/data → ввод PIN → пространство/группа → выбор полей → preview → импорт;'
          )
          text = text.replace('## Release gate 0.3.3', '## Release gate 0.3.4')
          text = text.replace('`Release gate 0.3.3`', '`Release gate 0.3.4`')
          text = text.replace('GitHub Release `v0.3.3`', 'GitHub Release `v0.3.4`')
          text = text.replace('до схемы 28;', 'до схемы 30;')
          write('docs/VALIDATION.md', text)

          # Миграционный тест теперь проверяет существующий main schema 29 → новый schema 30.
          text = read('tests/docomator-fields-migration.test.mjs')
          text = text.replace("test('обновление 28 → 29", "test('обновление 29 → 30")
          text = text.replace('migrationsThrough(root, 28)', 'migrationsThrough(root, 29)')
          text = text.replace('migrationsThrough(root, 29)', 'migrationsThrough(root, 30)', 1)
          text = text.replace('assert.equal(database.getSchemaVersion(), 28);', 'assert.equal(database.getSchemaVersion(), 29);')
          text = text.replace('assert.equal(database.getSchemaVersion(), 29);', 'assert.equal(database.getSchemaVersion(), 30);', 1)
          write('tests/docomator-fields-migration.test.mjs', text)

          # Загружаем UI-модуль полей из актуального bootstrap main.
          must_replace(
              'public/ux-next.js',
              "await import('./docomator-integration.js');\n",
              "await import('./docomator-integration.js');\nawait import('./docomator-fields.js');\n"
          )

          # Полный релизный gate включает все сценарии, уже находящиеся в main.
          must_replace(
              '.github/workflows/release-gate.yml',
              '          tests/browser/meeting-template-editor.spec.mjs\n          tests/browser/manual-plan-preferences.spec.mjs',
              '          tests/browser/meeting-template-editor.spec.mjs\n          tests/browser/meeting-template-library.spec.mjs\n          tests/browser/manual-plan-preferences.spec.mjs\n          tests/browser/assignment-simple-completion.spec.mjs'
          )
          must_replace(
              '.github/workflows/release.yml',
              '          npx playwright test tests/browser/meeting-template-editor.spec.mjs tests/browser/manual-plan-preferences.spec.mjs',
              '          npx playwright test tests/browser/meeting-template-editor.spec.mjs tests/browser/meeting-template-library.spec.mjs tests/browser/manual-plan-preferences.spec.mjs tests/browser/assignment-simple-completion.spec.mjs'
          )

          release_notes = '''# Kafedra Planner 0.3.4

## Главное

Версия `0.3.4` фиксирует очередной проверяемый эксплуатационный рубеж. Она объединяет выбор переносимых полей сотрудников из Оформлятора, библиотеку версий DOCX-шаблонов заседаний, прямое завершение задач без обязательного согласования, визуальный DOCX-шаблонизатор и адаптивное заполнение ручных планов. Схема SQLite повышена до `30`.

## Оформлятор: явный выбор данных сотрудника

После проверки адреса и порта система читает property definitions выбранного пространства. ФИО переносится всегда. Оператор отдельно назначает remote property для локальных полей `E-mail` и `Должность`, а телефон, подразделение, учёную степень и другие свойства типа `person` выбирает чекбоксами.

Дополнительные значения хранятся отдельно от базовой таблицы `people` вместе с `remote employee id`, ключом, подписью, типом и временем синхронизации. Выбранные ключи перепроверяются перед записью; удалённое или переименованное поле вызывает явный конфликт, а не тихую потерю данных. Повторный импорт остаётся идемпотентным и не удаляет локальные планы, задачи, назначения и историю. Код доступа Оформлятора не сохраняется.

Migration `030` добавляет `docomator_field_mappings` и `docomator_person_fields`. Обновление `29 → 30` не перестраивает существующих сотрудников, связи Оформлятора или библиотеку шаблонов заседаний.

## Заседания и DOCX

В выпуск входит библиотека версий шаблонов протоколов и выписок: основной шаблон, тестовое заполнение, точная историческая версия генерации, impact, обратимый архив и восстановление. Обычный DOCX можно настроить визуально в браузере; генерация сохраняет исходные OOXML-стили, нумерацию и повторяемые строки или абзацы. Отсутствие LibreOffice не блокирует готовый DOCX.

## Планы и задачи

Ручные пункты плана получают безопасные персональные значения по умолчанию только после явных действий пользователя. Сохранённые значения, календарная дата и руководитель из оргструктуры имеют приоритет. Задача завершается одним действием `Выполнено`; подтверждение руководителя и обязательный отчёт не требуются, а материалы остаются необязательными.

## Проверки выпуска

Release gate `0.3.4` проверяет:

- upgrade `29 → 30`, `quick_check`, `foreign_key_check` и backup/restore;
- discovery property definitions, рекомендации E-mail/Должности и выбор дополнительных полей;
- идемпотентный повторный импорт, обновление значений и конфликт исчезнувшего поля;
- desktop/mobile сценарий `адрес → порт → PIN → пространство → группа → поля → preview → импорт`;
- визуальный редактор и библиотеку версий DOCX-шаблонов заседаний;
- адаптивные ручные планы и прямое завершение задач;
- существующие планы, lifecycle, научные контуры, ACL, full offline bundle и rollback.

После успешных post-merge gates GitHub Actions собирает автономный Debian 12 bundle, установщик, пакет F2RE Project Control, контрольные суммы SHA-256 и публикует стабильный тег `v0.3.4`.
'''
          write('docs/releases/0.3.4.md', release_notes)

          # Финальные статические инварианты до запуска тестов.
          required = {
              'VERSION': '0.3.4',
              'package.json': '"version": "0.3.4"',
              'README.md': 'схема SQLite **30**',
              'README.en.md': 'SQLite schema **30**',
              'docs/ROADMAP.md': 'Текущая схема SQLite — `30`',
              'docs/UX_FLOWS.md': 'схема SQLite `30`',
              '.github/workflows/release-gate.yml': 'name: Release gate 0.3.4',
              '.github/workflows/release.yml': 'workflows: ["Release gate 0.3.4"]',
              'tests/docomator-fields-migration.test.mjs': 'обновление 29 → 30'
          }
          for path, needle in required.items():
              if needle not in read(path):
                  raise SystemExit(f'{path}: отсутствует обязательный маркер {needle!r}')
          if not Path('migrations/030_docomator_field_mapping.sql').is_file():
              raise SystemExit('не создана migration 030')
          PY

          git rm .github/workflows/prepare-release-0.3.4.yml

      - name: Проверить исходный код, миграции и release contract
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run smoke

      - name: Зафиксировать подготовленный выпуск
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          git commit -m "release: Kafedra Planner 0.3.4 — поля Оформлятора и schema 30"
          git push origin HEAD:release/0.3.4-docomator-fields
