name: Массовый импорт науки

on:
  workflow_dispatch:

concurrency:
  group: science-import-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  science-import-browser:
    name: science-import-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/science-import.spec.mjs
