name: Применить план-факт alpha.8

on:
  push:
    branches:
      - agent/plan-fact-personal
    paths:
      - .iteration8/ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/plan-fact-personal
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Проверить и применить пакет
        shell: bash
        run: |
          cat .iteration8/part-* | base64 --decode > /tmp/kafedra-plan-fact-alpha8.tar.gz
          echo "2fe9393403385038e348ff33dbdc94dbfe867757a06c72214fb2a1152a5f02e1  /tmp/kafedra-plan-fact-alpha8.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kafedra-plan-fact-alpha8.tar.gz
          npm run check
          npm test
          npm run smoke
          bash -n scripts/offline/*.sh deploy/install.sh
          rm -rf .iteration8 .github/workflows/apply-plan-fact.yml
      - name: Зафиксировать проверенный результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Добавить план-факт и персональный контроль"
          git push origin HEAD:agent/plan-fact-personal
