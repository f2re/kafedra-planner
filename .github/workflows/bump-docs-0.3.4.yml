name: One-shot docs bump 0.3.4

on:
  push:
    branches: [feature/docomator-fields-0.3.4]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/docomator-fields-0.3.4
          fetch-depth: 0
      - name: Обновить маркеры и описание 0.3.4
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Не найден ожидаемый фрагмент в {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('README.md',
              '> Текущий рубеж: **`0.3.3`**, схема SQLite **28**.',
              '> Текущий рубеж: **`0.3.4`**, схема SQLite **29**.')
          replace('README.md',
              'После подключения можно выбрать пространство, группу или всех сотрудников пространства и предварительно увидеть количество и ФИО. Синхронизация идемпотентна по `remote employee id`; первая загрузка может сопоставить существующего человека по нормализованному ФИО. Повторный импорт обновляет ту же запись и не удаляет локальные планы, задачи, отчёты, назначения и историю.',
              'После подключения можно выбрать пространство, группу или всех сотрудников пространства и предварительно увидеть количество и ФИО. Для выбранного пространства система читает определения полей сотрудников: ФИО переносится всегда, для `E-mail` и `Должность` можно назначить конкретные remote properties, а телефон, подразделение, учёную степень и другие свойства — выбрать отдельно. Синхронизация идемпотентна по `remote employee id`; повторный импорт обновляет ту же запись и не удаляет локальные планы, задачи, отчёты, назначения и историю.')
          replace('README.md',
              'Заседание существует как самостоятельная запись до появления итогового файла. Повестка формируется вручную, из пункта плана или задачи. Для каждого вопроса фиксируются фактические `Слушали / Обсудили / Решили`; затем система формирует полный протокол либо выписку по выбранным вопросам. Сформированный DOCX регистрируется как обычный неизменяемый документ, а повтор неизменённого запроса не создаёт копию.',
              'Заседание существует как самостоятельная запись до появления итогового файла. Повестка формируется вручную, из пункта плана или задачи. Для каждого вопроса фиксируются фактические `Слушали / Обсудили / Решили`; затем система формирует полный протокол либо выписку по выбранным вопросам. Обычный DOCX можно превратить в шаблон визуально: оператор назначает поля и повторяемые блоки в браузере, а генерация сохраняет исходные OOXML-стили, нумерацию и структуру. Сформированный DOCX регистрируется как обычный неизменяемый документ, а повтор неизменённого запроса не создаёт копию.')

          replace('README.en.md',
              '> Current milestone: **`0.3.3`**, SQLite schema **28**.',
              '> Current milestone: **`0.3.4`**, SQLite schema **29**.')

          replace('docs/ROADMAP.md',
              '## Текущий рубеж — `0.3.3`',
              '## Текущий рубеж — `0.3.4`')
          replace('docs/ROADMAP.md',
              '- необязательное подключение к Оформлятору и идемпотентный импорт сотрудников по пространству/группе;',
              '- необязательное подключение к Оформлятору, идемпотентный импорт сотрудников по пространству/группе и явный выбор переносимых полей;')
          replace('docs/ROADMAP.md',
              '`0.3.3` добавляет безопасную локально-сетевую интеграцию с Оформлятором: адрес и порт настраиваются оператором, соединение проверяется на уровнях health/readiness/data, пространство и группа выбираются явно, код доступа не сохраняется, а повторная синхронизация обновляет уже связанную локальную запись без удаления истории. Контуры планов, автоматических назначений, lifecycle и публичной поставки из `0.3.0–0.3.2` сохраняются. Текущая схема SQLite — `28`.',
              '`0.3.4` добавляет выбор переносимых полей из Оформлятора поверх безопасной интеграции `0.3.3`: ФИО переносится всегда, e-mail и должность маппятся явно, произвольные свойства сохраняются отдельно с remote property key, а удалённое поле не теряется молча. В тот же рубеж входит визуальный DOCX-шаблонизатор заседаний с сохранением OOXML-стилей и нумерации. Контуры планов, автоматических назначений, lifecycle и публичной поставки сохраняются. Текущая схема SQLite — `29`.')
          replace('docs/ROADMAP.md',
              'Состояние: реализовано в `0.3.0–0.3.3`, схемы `26–28`.',
              'Состояние: реализовано в `0.3.0–0.3.4`, схемы `26–29`.')
          replace('docs/ROADMAP.md',
              '`0.3.3` добавляет необязательный импорт сотрудников из локального Оформлятора:',
              '`0.3.3` добавила необязательный импорт сотрудников из локального Оформлятора, а `0.3.4` — выбор и хранение переносимых полей:')

          replace('docs/RELEASE_CANDIDATE.md', '# Release candidate 0.3.3', '# Release candidate 0.3.4')
          replace('docs/RELEASE_CANDIDATE.md',
              '`0.3.3` — текущий эксплуатационный release candidate, схема SQLite **28**.',
              '`0.3.4` — текущий эксплуатационный release candidate, схема SQLite **29**.')
          replace('docs/RELEASE_CANDIDATE.md', '## Что входит в 0.3.3', '## Что входит в 0.3.4')

          replace('docs/VALIDATION.md',
              'Актуальный рубеж: `0.3.3`, схема SQLite **28**.',
              'Актуальный рубеж: `0.3.4`, схема SQLite **29**.')
          replace('docs/VALIDATION.md',
              '- миграции старых поддерживаемых схем до 28;',
              '- миграции старых поддерживаемых схем до 29;')
          replace('docs/VALIDATION.md',
              '- настройки Оформлятора без PIN, внешние связи сотрудников и upgrade `27 → 28`;',
              '- настройки Оформлятора без PIN, внешние связи сотрудников, upgrade `27 → 28` и field mapping `28 → 29`;')
          replace('docs/VALIDATION.md',
              '- mock health/readiness/auth/data, первый и повторный импорт, rename/inactive без дублей;',
              '- mock health/readiness/auth/data, discovery property definitions, выбор e-mail/должности/дополнительных полей, первый и повторный импорт, rename/inactive без дублей;')

          replace('docs/UX_FLOWS.md',
              'Статус: рабочие контуры версии `0.3.3`, схема SQLite `28`.',
              'Статус: рабочие контуры версии `0.3.4`, схема SQLite `29`.')
      - name: Зафиксировать документацию
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md README.en.md docs/ROADMAP.md docs/RELEASE_CANDIDATE.md docs/VALIDATION.md docs/UX_FLOWS.md
          git diff --cached --check
          git commit -m "docs: перевести текущий рубеж на 0.3.4"
          git push origin HEAD:feature/docomator-fields-0.3.4
