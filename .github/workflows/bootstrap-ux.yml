name: Развернуть календарный UX

on:
  pull_request:
    paths:
      - .bootstrap-ux/ready

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Проверить и развернуть изменения
        shell: bash
        run: |
          test ! -f migrations/002_calendar_templates_notifications.sql || exit 0
          cat .bootstrap-ux/part-* | base64 --decode > /tmp/kafedra-ux.tar.gz
          echo "a1c7b32fb81bb2b7f8c18633ba1e3718b403ff4188f0ad74429829eb2e602bf6  /tmp/kafedra-ux.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kafedra-ux.tar.gz
          rm -rf .bootstrap-ux

      - name: Зафиксировать изменения
        shell: bash
        run: |
          test -f migrations/002_calendar_templates_notifications.sql || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Реализовать календарный UX и мастер шаблонов"
          git push origin "HEAD:${{ github.head_ref }}"
