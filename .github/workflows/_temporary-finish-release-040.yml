name: Temporary finish release 0.4.0 non-workflow changes

on:
  push:
    branches:
      - ci/finish-release-040

permissions:
  contents: write

concurrency:
  group: temporary-finish-release-040
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout helper payload
        uses: actions/checkout@v4
        with:
          ref: ci/finish-release-040
          path: helper
          fetch-depth: 1
      - name: Checkout exact pull-request branch
        uses: actions/checkout@v4
        with:
          ref: feature/183-academic-performance-0.4.0
          path: target
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: target/.nvmrc
          cache: npm
          cache-dependency-path: target/package-lock.json
      - name: Apply exact prepared completion patches
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "08fb6f939a41533d81e9866c88339f4ee77879a5"
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          def decode(directory: str, destination: str) -> None:
              chunks = sorted(Path(directory).glob('chunk-*'))
              if not chunks:
                  raise SystemExit(f'No chunks in {directory}')
              payload = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
              payload += '=' * (-len(payload) % 4)
              compressed = base64.urlsafe_b64decode(payload)
              Path(destination).write_bytes(gzip.decompress(compressed))

          decode('helper/.github/finish-release-040', '/tmp/release-040-tracked.patch')
          decode('helper/.github/finish-release-040-new', '/tmp/release-040-newfiles.patch')
          PY
          git -C target apply --check /tmp/release-040-tracked.patch
          git -C target apply /tmp/release-040-tracked.patch
          git -C target apply --check /tmp/release-040-newfiles.patch
          git -C target apply /tmp/release-040-newfiles.patch
          git -C target diff --check
          if git -C target diff --name-only | grep -q '^\.github/workflows/'; then
            echo 'Prepared non-workflow patches attempted to modify workflow files' >&2
            exit 1
          fi
      - name: Verify complete release source
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run smoke
          npm run backup:selftest
          test "$(tr -d '[:space:]' < VERSION)" = "0.4.0"
          test -f packages/academic-performance/src/report.mjs
          test -f tests/academic-performance-period-totals.test.mjs
          grep -Fq 'academic.import' public/action-registry.js
          grep -Fq 'academic.import' public/action-center.js
          grep -Fq 'academic_grade_records' packages/system/src/acceptance.mjs
          grep -Fq 'prefers-reduced-motion' public/academic-performance-next.css
          grep -Fq 'schema SQLite 31' docs/TARGET_ACCEPTANCE.md
      - name: Commit verified non-workflow changes
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release 0.4.0: complete academic performance vertical' -m 'Adds Action Center integration, selected-group totals, acceptance coverage, release metadata and regression tests. Refs #183.'
          git push origin HEAD:feature/183-academic-performance-0.4.0
