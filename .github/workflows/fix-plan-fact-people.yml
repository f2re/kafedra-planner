name: Исправить обновление профилей план-факт

on:
  push:
    branches:
      - agent/plan-fact-personal
    paths:
      - .fix-plan-fact-people/ready

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/plan-fact-personal
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Сделать справочник профилей реактивным
        run: |
          node scripts/fix-plan-fact-people.mjs
          npm run check
          npm test
          npm run smoke
          bash -n scripts/offline/*.sh deploy/install.sh
          rm -rf .fix-plan-fact-people scripts/fix-plan-fact-people.mjs .github/workflows/fix-plan-fact-people.yml
      - name: Зафиксировать исправление
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Обновлять профили при открытии план-факт"
          git push origin HEAD:agent/plan-fact-personal
