name: Сформировать release tree 0.4.1

on:
  push:
    branches:
      - release/0.4.1-280-final

concurrency:
  group: stage-release-0.4.1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stage:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/0.4.1-280-final
          token: ${{ github.token }}
      - name: Сформировать изменения без записи workflow-файлов
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(tr -d '[:space:]' < VERSION)" = 0.4.0
          awk '
            /^          python3 - <<'"'"'PY'"'"'$/ { inside=1; next }
            inside && /^          PY$/ { exit }
            inside { sub(/^          /, ""); print }
          ' .github/workflows/apply-release-0.4.1.yml > /tmp/apply-release.py
          test -s /tmp/apply-release.py
          python3 /tmp/apply-release.py
          cp .github/workflows/release-gate.yml tests/.generated-release-gate-0.4.1.yml
          cp .github/workflows/release.yml tests/.generated-release-publisher-0.4.1.yml
          git checkout origin/main -- \
            .github/workflows/release-gate.yml \
            .github/workflows/release.yml \
            .github/workflows/release-0.4.1-prep.yml \
            .github/workflows/apply-release-0.4.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: сформировать дерево Kafedra Planner 0.4.1 (#280)"
          git push origin HEAD:release/0.4.1-280-final
