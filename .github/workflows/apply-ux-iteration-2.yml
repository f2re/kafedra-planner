name: Применить вторую UX-итерацию

on:
  push:
    branches:
      - agent/inspector-drafts-ux
    paths:
      - .ux-iteration-2/ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/inspector-drafts-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Обновить HTML и UX-документацию
        run: |
          node scripts/apply-ux-iteration-2.mjs
          rm -rf .ux-iteration-2 scripts/apply-ux-iteration-2.mjs
      - name: Зафиксировать результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Подключить инспектор и восстановление черновиков"
          git push origin HEAD:agent/inspector-drafts-ux
