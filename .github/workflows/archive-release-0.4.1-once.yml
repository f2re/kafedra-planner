name: Archive release 0.4.1 once

on:
  push:
    branches:
      - chore/archive-release-0.4.1
    paths:
      - .github/workflows/archive-release-0.4.1-once.yml

permissions:
  contents: write

concurrency:
  group: archive-release-0.4.1
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/archive-release-0.4.1

      - name: Move the exact complete bundle to applied archive
        run: |
          set -Eeuo pipefail
          active='.grace/changes/active/C-RELEASE-0-4-1'
          archive='.grace/changes/archive/C-RELEASE-0-4-1'
          test -d "$active"
          test ! -e "$archive"
          mapfile -t before < <(find "$active" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          printf '%s\n' "${before[@]}" | grep -Fx spec.xml
          printf '%s\n' "${before[@]}" | grep -Fx plan.xml
          printf '%s\n' "${before[@]}" | grep -Fx release-audit.md
          mkdir -p "$(dirname "$archive")"
          git mv "$active" "$archive"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.grace/changes/archive/C-RELEASE-0-4-1')
          for name in ('spec.xml','plan.xml'):
              path=root/name
              text=path.read_text(encoding='utf-8')
              marker='status="approved"'
              if text.count(marker)!=1:
                  raise SystemExit(f'{name}: expected one approved root status')
              path.write_text(text.replace(marker,'status="applied"',1),encoding='utf-8')
          PY
          rm -f .github/workflows/archive-release-0.4.1-once.yml

      - name: Verify archive-only final diff
        run: |
          set -Eeuo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed_active='.grace/changes/active/C-RELEASE-0-4-1/'
          allowed_archive='.grace/changes/archive/C-RELEASE-0-4-1/'
          paths=subprocess.check_output(['git','diff','--name-only','origin/main'],text=True).splitlines()
          bad=[p for p in paths if not (p.startswith(allowed_active) or p.startswith(allowed_archive) or p=='.github/workflows/archive-release-0.4.1-once.yml')]
          if bad:
              raise SystemExit('unexpected paths: '+', '.join(bad))
          active=set(subprocess.check_output(['git','ls-tree','-r','--name-only','origin/main',allowed_active],text=True).splitlines())
          expected={p.replace(allowed_active,allowed_archive,1) for p in active}
          actual=set(p for p in paths if p.startswith(allowed_archive))
          if actual!=expected:
              raise SystemExit(f'archive file set mismatch: expected={sorted(expected)} actual={sorted(actual)}')
          PY

      - name: Commit terminal transition and remove one-shot workflow
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'GRACE: apply archive C-RELEASE-0-4-1'
          git push origin HEAD:chore/archive-release-0.4.1
