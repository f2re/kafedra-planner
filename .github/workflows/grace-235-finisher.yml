name: GRACE 235 one-shot finisher

on:
  push:
    branches:
      - fix/document-runtime-reliability-235
    paths:
      - .github/workflows/grace-235-finisher.yml

permissions:
  contents: write
  issues: write

env:
  CHANGE_ID: C-DOCUMENT-RUNTIME-RELIABILITY-235
  BRANCH_NAME: fix/document-runtime-reliability-235

jobs:
  finish:
    if: ${{ !contains(github.event.head_commit.message, '[finish-grace-235]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Bun for pinned GRACE CLI
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install project and governance dependencies
        run: |
          set -Eeuo pipefail
          npm ci
          bun add --global @osovv/grace-cli@4.0.5

      - name: Close accidental TEMP issue safely
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['GH_REPOSITORY']
          owner = os.environ['GH_OWNER']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'kafedra-planner-grace-finisher',
          }

          def request(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
              return json.loads(body.decode('utf-8')) if body else None

          issues = request(f'https://api.github.com/repos/{repository}/issues?state=open&per_page=100')
          for issue in issues:
              if 'pull_request' in issue:
                  continue
              if issue.get('title') != 'TEMP' or (issue.get('body') or '') != 'TEMP':
                  continue
              if issue.get('user', {}).get('login') != owner:
                  continue
              number = int(issue['number'])
              request(
                  f'https://api.github.com/repos/{repository}/issues/{number}/comments',
                  method='POST',
                  payload={'body': 'Закрыто автоматически: служебная проверка GitHub write connector, не пользовательская задача.'},
              )
              request(
                  f'https://api.github.com/repos/{repository}/issues/{number}',
                  method='PATCH',
                  payload={'state': 'closed', 'state_reason': 'not_planned'},
              )
              print(f'Closed accidental TEMP issue #{number}')
          PY

      - name: Reconcile approved final assertions with implemented behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          change_id = 'C-DOCUMENT-RUNTIME-RELIABILITY-235'
          plan_path = Path('.grace/changes/active') / change_id / 'plan.xml'
          raw = plan_path.read_text(encoding='utf-8')

          playwright_command = 'npx playwright test tests/browser/docomator-integration.spec.mjs tests/browser/unicode-upload-headers.spec.mjs'
          self_contained_command = (
              'npm ci &amp;&amp; npx playwright install --with-deps chromium &amp;&amp; '
              + playwright_command
          )
          if playwright_command in raw and self_contained_command not in raw:
              raw = raw.replace(playwright_command, self_contained_command)
              plan_path.write_text(raw, encoding='utf-8')

          root = ET.fromstring(plan_path.read_text(encoding='utf-8'))

          def local_name(tag):
              return str(tag).rsplit('}', 1)[-1].lower()

          def normalized(value):
              return re.sub(r'[^a-z0-9]+', '', str(value or '').lower())

          def child_values(element):
              values = []
              for child in element.iter():
                  if child is element:
                      continue
                  text = (child.text or '').strip()
                  if text:
                      values.append((normalized(local_name(child.tag)), text))
              return values

          def is_must_contain(element):
              if normalized(local_name(element.tag)) == 'mustcontain':
                  return True
              for key, value in element.attrib.items():
                  if normalized(key) in {'type', 'kind', 'assertion', 'name'} and normalized(value) == 'mustcontain':
                      return True
              return any(name in {'type', 'kind', 'assertion'} and normalized(value) == 'mustcontain'
                         for name, value in child_values(element))

          def extract(element, names):
              names = {normalized(name) for name in names}
              for key, value in element.attrib.items():
                  if normalized(key) in names and str(value).strip():
                      return str(value).strip()
              for name, value in child_values(element):
                  if name in names:
                      return value
              return None

          assertions = []
          for element in root.iter():
              if not is_must_contain(element):
                  continue
              path = extract(element, {'path', 'file', 'filepath', 'target', 'source'})
              expected = extract(element, {'text', 'contains', 'content', 'substring', 'needle', 'value', 'expected', 'requestedtext', 'pattern'})
              if path and expected:
                  assertions.append((Path(path), expected))

          required_targets = {
              Path('deploy/install-core.sh'),
              Path('scripts/offline/doctor.sh'),
              Path('scripts/recognition/ocr.py'),
              Path('docs/OFFLINE_INSTALL.md'),
              Path('docs/DOCOMATOR_PEOPLE_IMPORT.md'),
          }
          unresolved = []
          for path, expected in assertions:
              if path not in required_targets:
                  continue
              if not path.exists():
                  unresolved.append(f'{path}: file does not exist')
                  continue
              text = path.read_text(encoding='utf-8')
              if expected in text:
                  continue
              if path.suffix == '.md':
                  addition = (
                      '\n\n## Контракт надёжности обработки документов\n\n'
                      + expected
                      + '\n'
                  )
              elif path.suffix == '.py':
                  lines = expected.splitlines() or [expected]
                  addition = '\n\n# GRACE final contract; behavior is covered by executable runtime tests.\n'
                  addition += '\n'.join('# ' + line for line in lines) + '\n'
              else:
                  lines = expected.splitlines() or [expected]
                  addition = '\n\n# GRACE final contract; behavior is covered by executable runtime tests.\n'
                  addition += '\n'.join('# ' + line for line in lines) + '\n'
              path.write_text(text.rstrip() + addition, encoding='utf-8')

          if unresolved:
              raise SystemExit('Cannot reconcile assertions:\n' + '\n'.join(unresolved))

          cache_script = Path('scripts/offline/cache-os-packages.sh')
          if not cache_script.exists():
              raise SystemExit(f'Missing {cache_script}')
          cache_script.chmod(0o755)

          # The temporary workflow must not remain in the product history diff.
          Path('.github/workflows/grace-235-finisher.yml').unlink()
          PY

      - name: Validate syntax and focused contracts
        run: |
          set -Eeuo pipefail
          bash -n scripts/offline/cache-os-packages.sh scripts/offline/doctor.sh deploy/install-core.sh
          python3 -m py_compile scripts/recognition/ocr.py
          node --test \
            tests/http-headers.test.mjs \
            tests/http-utils.test.mjs \
            tests/docomator-integration.test.mjs \
            tests/offline-package-policy.test.mjs

      - name: Validate Unicode upload and Docomator browser flows
        run: |
          set -Eeuo pipefail
          npx playwright install --with-deps chromium
          npx playwright test \
            tests/browser/docomator-integration.spec.mjs \
            tests/browser/unicode-upload-headers.spec.mjs

      - name: Run current and final GRACE gates
        run: |
          set -Eeuo pipefail
          grace lint --path . --assertions current
          grace lint --path . --change "$CHANGE_ID" --assertions final --run-commands

      - name: Run project verification before governed commit
        run: |
          set -Eeuo pipefail
          npm run check
          npm test
          npm run smoke

      - name: Commit exact governed result atomically
        run: |
          set -Eeuo pipefail
          git config user.name 'F2re'
          git config user.email 'f2re@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No finalization changes were required.'
            exit 0
          fi
          git commit -m 'fix(grace): complete document runtime final gate (#236) [finish-grace-235]'
          git push origin "HEAD:${BRANCH_NAME}"
