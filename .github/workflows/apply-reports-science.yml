name: Применить отчёты и научный реестр

on:
  push:
    branches:
      - agent/reports-approval-science
    paths:
      - .iteration7/ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/reports-approval-science
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Проверить и развернуть пакет
        shell: bash
        run: |
          cat .iteration7/part-* | base64 --decode > /tmp/kafedra-reports-science.tar.gz
          echo "d8a63f3179b9c5acf4a2b9d2f4240b86f2baaf43526f5ea5ce4dda6e7f1801ab  /tmp/kafedra-reports-science.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kafedra-reports-science.tar.gz
          node scripts/apply-reports-science.mjs
          python3 - <<'PY'
          from pathlib import Path

          matcher = Path('packages/reports/src/matcher.mjs')
          source = matcher.read_text()
          source = source.replace(
              "const contribution = Math.min(0.2, 0.12 + 0.04 * (matchedExecutors.length - 1));",
              "const contribution = Math.min(0.24, 0.16 + 0.04 * (matchedExecutors.length - 1));"
          )
          source = source.replace(
              r"if (/\b(отчет|отчёт|справка|акт|выполнен|исполнен|результат)\b/iu.test(haystack)) {",
              r"if (/(?:отчет|отчёт|справка|акт|выполнен|исполнен|результат)/iu.test(haystack)) {"
          )
          matcher.write_text(source)

          science = Path('packages/science/src/extractor.mjs')
          source = science.read_text()
          source = source.replace(
              r"if (/\bвак\b|переч(?:ень|ня)\s+вак/iu.test(value))",
              r"if (/(?:вак)|переч(?:ень|ня)\s+вак/iu.test(value))"
          )
          source = source.replace(
              r"if (/\bринц\b|russian science citation index/iu.test(value))",
              r"if (/(?:ринц)|russian science citation index/iu.test(value))"
          )
          source = source.replace(
              r"if (/\bмбд\b/iu.test(value))",
              r"if (/(?:мбд)/iu.test(value))"
          )
          science.write_text(source)
          PY
          rm -rf .iteration7 scripts/apply-reports-science.mjs
      - name: Проверить проект
        run: |
          npm run check
          npm test
          npm run smoke
          bash -n scripts/offline/*.sh deploy/install.sh
      - name: Зафиксировать результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Добавить сопоставление отчётов и научный реестр"
          git push origin HEAD:agent/reports-approval-science
