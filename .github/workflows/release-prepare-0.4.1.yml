name: Prepare release 0.4.1 metadata

on:
  push:
    branches:
      - release/0.4.1-v2
    paths:
      - .github/workflows/release-prepare-0.4.1.yml

permissions:
  contents: write

concurrency:
  group: release-0.4.1-metadata
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.4.1-v2
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Update authoritative release metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const version = '0.4.1';

          fs.writeFileSync('VERSION', `${version}\n`);

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = version;
          if (lock.packages && lock.packages['']) lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE

          python3 <<'PY'
          from pathlib import Path
          import re

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = 'Текущая версия: `0.4.1`.'
          if re.search(r'^Текущая версия: `[^`]+`\.$', text, flags=re.M):
              text = re.sub(r'^Текущая версия: `[^`]+`\.$', marker, text, count=1, flags=re.M)
          elif marker not in text:
              lines = text.splitlines()
              insert_at = 1 if lines and lines[0].startswith('#') else 0
              lines[insert_at:insert_at] = ['', marker, '']
              text = '\n'.join(lines)
          readme.write_text(text.rstrip() + '\n', encoding='utf-8')

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          text = text.replace('## Текущий рубеж — `0.4.0`', '## Текущий рубеж — `0.4.1`', 1)
          text = text.replace('`0.4.0` является текущим законченным релизным рубежом.', '`0.4.1` является текущим законченным релизным рубежом.', 1)
          if '## Текущий рубеж — `0.4.1`' not in text:
              raise SystemExit('ROADMAP current release marker was not updated')
          roadmap.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/release-prepare-0.4.1.yml

      - name: Commit the atomic metadata update
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION package.json package-lock.json README.md docs/ROADMAP.md
          git diff --cached --check
          git commit -m 'release: prepare 0.4.1 metadata (#254)'
          git push origin HEAD:release/0.4.1-v2
