name: Temporary source snapshot

on:
  push:
    branches:
      - feature/academic-performance-040

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fe2cf88a2a31d04020f4ddfea19b5fed356131a
          fetch-depth: 1
      - name: Pack verified release helper source tree
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "1fe2cf88a2a31d04020f4ddfea19b5fed356131a"
          tar --exclude=.git -czf /tmp/kafedra-release-helper.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: kafedra-release-helper-source
          path: /tmp/kafedra-release-helper.tgz
          retention-days: 1
          if-no-files-found: error
