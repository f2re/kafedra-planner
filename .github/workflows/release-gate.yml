name: Release gate 0.2.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: release-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run smoke

  v020-migrations:
    name: release-migrations-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Schema 19 → current and release evidence
        run: >-
          node --test
          tests/organization-migration.test.mjs
          tests/science-lifecycle-migration.test.mjs
          tests/science-import-migration.test.mjs
          tests/science-reports-migration.test.mjs
          tests/acceptance-020.test.mjs
          tests/backup-restore.test.mjs
          tests/target-acceptance.test.mjs

  v020-browser:
    name: release-browser-desktop-mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Complete 0.2.0 scenarios
        run: >-
          npx playwright test
          tests/browser/organization.spec.mjs
          tests/browser/science-lifecycle.spec.mjs
          tests/browser/science-import.spec.mjs
          tests/browser/science-reports.spec.mjs

  release-gate:
    name: release-gate
    if: always()
    needs: [quality, v020-migrations, v020-browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every release job
        env:
          QUALITY: ${{ needs.quality.result }}
          MIGRATIONS: ${{ needs.v020-migrations.result }}
          BROWSER: ${{ needs.v020-browser.result }}
        run: |
          printf 'quality=%s\nmigrations=%s\nbrowser=%s\n' "$QUALITY" "$MIGRATIONS" "$BROWSER"
          test "$QUALITY" = success
          test "$MIGRATIONS" = success
          test "$BROWSER" = success
