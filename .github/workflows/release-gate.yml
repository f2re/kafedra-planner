name: Release gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: release-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run smoke

  recovery:
    name: release-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify existing schema, backup and restore contracts
        run: >-
          node --test
          tests/organization-migration.test.mjs
          tests/science-lifecycle-migration.test.mjs
          tests/science-import-migration.test.mjs
          tests/science-reports-migration.test.mjs
          tests/plan-source-rows-migration.test.mjs
          tests/docomator-integration-migration.test.mjs
          tests/meeting-template-library-migration.test.mjs
          tests/docomator-fields-migration.test.mjs
          tests/academic-performance-migration.test.mjs
          tests/academic-performance-backup.test.mjs
          tests/lifecycle.test.mjs
          tests/backup-restore.test.mjs
          tests/target-acceptance.test.mjs
      - run: npm run backup:selftest

  browser:
    name: release-browser-critical
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Critical working scenarios
        run: >-
          npx playwright test
          tests/browser/protocol-import.spec.mjs
          tests/browser/meetings.spec.mjs
          tests/browser/meeting-template-editor.spec.mjs
          tests/browser/meeting-template-library.spec.mjs
          tests/browser/plan-source-rows.spec.mjs
          tests/browser/auto-assignment.spec.mjs
          tests/browser/docomator-integration.spec.mjs
          tests/browser/docomator-fields.spec.mjs
          tests/browser/academic-performance.spec.mjs
          tests/browser/lifecycle.spec.mjs
      - name: PIN and ACL regressions
        run: |
          npm run test:browser:auth
          npm run test:browser:acl

  release-gate:
    name: release-gate
    if: always()
    needs: [quality, recovery, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every release job
        env:
          QUALITY: ${{ needs.quality.result }}
          RECOVERY: ${{ needs.recovery.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          printf 'quality=%s\nrecovery=%s\nbrowser=%s\n' "$QUALITY" "$RECOVERY" "$BROWSER"
          test "$QUALITY" = success
          test "$RECOVERY" = success
          test "$BROWSER" = success
