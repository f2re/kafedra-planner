name: Применить OCR и предпросмотр

on:
  push:
    branches:
      - agent/ocr-preview-template-source
    paths:
      - .iteration5/ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ocr-preview-template-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Проверить и развернуть пакет
        shell: bash
        run: |
          cat .iteration5/part-* | base64 --decode > /tmp/kafedra-iteration5.tar.gz
          echo "c7fdf6de340b06ab345bb754cc469b018d4dcdb05eb1d6a9f588f84c004ba380  /tmp/kafedra-iteration5.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kafedra-iteration5.tar.gz
          rm -rf .iteration5
      - name: Проверить проект
        run: |
          npm run check
          npm test
          npm run smoke
          bash -n scripts/offline/*.sh deploy/install.sh
      - name: Зафиксировать результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Добавить OCR, предпросмотр и структурные поля"
          git push origin HEAD:agent/ocr-preview-template-source
